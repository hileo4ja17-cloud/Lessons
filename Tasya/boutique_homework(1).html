:root{--plum:#3A2457;--plum2:#5B3D86;--lilac:#B79AD6;--lilac-s:#EFE7F8;--sage:#4E9A62;--sage-s:#DDEFE2;--gold:#D8B25A;--gold-s:#F7EAC4;
  --ink:#2E2340;--muted:#7C7088;--cream:#FBF6EE;--card:#fff;--red:#C8553D;--r:22px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Quicksand","NunitoCyr",system-ui,sans-serif;font-weight:600;font-size:19px;line-height:1.45;color:var(--ink);background:var(--cream);
  background-image:radial-gradient(circle at 12px 12px,rgba(183,154,214,.18) 2px,transparent 2.5px),radial-gradient(circle at 36px 36px,rgba(216,178,90,.16) 2px,transparent 2.5px);background-size:48px 48px;min-height:100vh}
h1,h2,h3,h4{font-family:"Fredoka","NunitoCyr",sans-serif;font-weight:600;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sage);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
svg.cl{width:100%;height:100%;display:block;overflow:visible}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(251,246,238,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--gold-s)}
.topin{max-width:1240px;margin:0 auto;padding:10px clamp(12px,3vw,26px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:"Pacifico";font-size:28px;color:var(--plum);display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo .tag{width:38px;height:38px}
.count{display:flex;align-items:center;gap:6px;background:var(--plum);color:#fff;border-radius:99px;padding:3px 14px 3px 6px;font-family:"Fredoka";font-weight:600}
.count svg{width:28px;height:28px}
.rank{font-family:"Fredoka";color:var(--plum2);font-weight:600}
.sp{flex:1}
.tb{border:2px solid var(--lilac);background:#fff;border-radius:99px;padding:3px 14px;font-weight:700;font-size:15px;color:var(--plum)}
.tb[aria-pressed="false"]{opacity:.5}
.deps{max-width:1240px;margin:0 auto;padding:0 clamp(12px,3vw,26px) 10px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.dep{flex:none;border:2px solid var(--lilac-s);background:#fff;border-radius:14px;padding:5px 14px;font-family:"Fredoka";font-weight:500;color:var(--plum);display:flex;gap:8px;align-items:center}
.dep b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--lilac-s);font-size:14px}
.dep[aria-current="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}
.dep[aria-current="true"] b{background:var(--gold);color:var(--plum)}
.dep.done b{background:var(--sage);color:#fff}
.dep:disabled{opacity:.45;cursor:not-allowed}

.wrap{max-width:1240px;margin:0 auto;padding:20px clamp(12px,3vw,26px) 80px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
/* hero */
.hero{position:relative;border-radius:28px;overflow:hidden;margin-bottom:24px;box-shadow:0 26px 50px -30px rgba(58,36,87,.6)}
.hero img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.hero .glass{position:absolute;left:clamp(14px,3vw,30px);bottom:clamp(14px,3vw,30px);max-width:min(460px,80%);background:rgba(255,255,255,.86);backdrop-filter:blur(6px);border-radius:22px;padding:18px 22px;
  box-shadow:0 10px 30px rgba(58,36,87,.2);animation:rise .8s cubic-bezier(.2,1.2,.3,1) .2s both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.hero h1{font-family:"Pacifico";font-weight:400;font-size:clamp(30px,4.6vw,48px);color:var(--plum)}
.hero p{margin:8px 0 14px}
.sparkle{position:absolute;width:14px;height:14px;pointer-events:none;animation:tw 2.4s ease-in-out infinite}
.sparkle:before,.sparkle:after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.sparkle:before{width:100%;height:3px}.sparkle:after{width:3px;height:100%}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}

/* rail panel */
.railbox{position:sticky;top:120px;background:linear-gradient(180deg,#fff,var(--lilac-s));border-radius:26px;padding:16px 14px;border:2px solid var(--gold-s);box-shadow:0 18px 40px -26px rgba(58,36,87,.6)}
.railbox h3{font-family:"Pacifico";font-weight:400;color:var(--plum);font-size:24px;text-align:center}
.railbox .sub{text-align:center;color:var(--muted);font-size:15px;margin-bottom:6px}
.rail{position:relative;height:66px;margin:6px 0 4px;display:grid;grid-template-columns:repeat(11,1fr)}
.rail:before{content:"";position:absolute;left:-4px;right:-4px;top:6px;height:5px;border-radius:5px;background:linear-gradient(90deg,#C49A3E,#F3D98B,#C49A3E)}
.slot{position:relative}
.slot .hg{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:16px;height:12px;border:2px solid #8B7A99;border-bottom:0;border-radius:8px 8px 0 0;opacity:.25}
.slot.on .hg{opacity:1}
.slot .it{position:absolute;left:50%;top:15px;width:30px;height:38px;margin-left:-15px;transform-origin:50% -6px}
.slot .it.swing{animation:swing 1.4s cubic-bezier(.3,1.5,.4,1)}
@keyframes swing{0%{transform:translateY(-30px) rotate(-30deg);opacity:0}30%{opacity:1}50%{transform:rotate(16deg)}75%{transform:rotate(-8deg)}100%{transform:none}}
.railnum{text-align:center;font-family:"Fredoka";font-weight:600;color:var(--plum);margin-top:6px}

/* stage */
.stage{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}}
.shead{display:flex;align-items:center;gap:14px;margin:4px 0 18px}
.shead .ic{width:70px;height:70px;border-radius:22px;background:var(--plum);padding:10px;flex:none;box-shadow:0 8px 0 -2px var(--lilac)}
.shead h2{font-size:clamp(30px,4vw,40px);color:var(--plum)}
.shead p{margin:2px 0 0;color:var(--muted)}
.task{background:var(--card);border-radius:var(--r);padding:clamp(16px,2.6vw,26px);margin-bottom:22px;border:2px solid var(--lilac-s);position:relative}
.task.complete{border-color:#A9D3B4}
.task.complete:after{content:"Done!";position:absolute;right:18px;top:16px;background:var(--sage-s);color:var(--sage);font-family:"Fredoka";border-radius:99px;padding:1px 12px;font-size:15px}
.task h3{font-size:26px;color:var(--plum);display:flex;gap:10px;align-items:center}
.task h3 .no{background:var(--gold);color:var(--plum);border-radius:10px;font-size:17px;padding:0 10px;line-height:30px}
.inst{margin:6px 0 16px;font-size:18px}.ru{margin:2px 0 14px;color:var(--muted);font-size:15.5px;font-style:italic}
.fb{min-height:28px;font-weight:700;margin-top:10px}.fb.ok{color:var(--sage)}.fb.no{color:var(--red)}
.btn{border:0;border-radius:16px;padding:10px 22px;font-family:"Fredoka";font-weight:600;font-size:19px;background:var(--plum);color:#fff;box-shadow:0 5px 0 #24163A;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #24163A}
.btn.sage{background:var(--sage);box-shadow:0 5px 0 #2F6B45}
.btn.gold{background:var(--gold);color:var(--plum);box-shadow:0 5px 0 #A9853A}
.btn.ghost{background:#fff;color:var(--plum);border:2px solid var(--lilac);box-shadow:0 5px 0 var(--lilac-s)}
.nextbar{display:flex;justify-content:flex-end;margin-top:4px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;perspective:900px}
.mc{border:0;padding:0;background:none;aspect-ratio:1/1.05}
.mc .in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:grid;place-items:center}
.mc .f{background:linear-gradient(135deg,var(--plum),var(--plum2));box-shadow:inset 0 0 0 4px rgba(243,217,139,.6)}
.mc .f svg{width:46%;height:46%}
.mc .b{transform:rotateY(180deg);background:#fff;border:3px solid var(--lilac-s);padding:12%}
.mc .b.word{font-family:"Fredoka";font-size:clamp(18px,2.4vw,26px);color:var(--plum)}
.mc.got .b{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-s),0 0 22px rgba(78,154,98,.4)}
.memstat{display:flex;gap:14px;margin-top:12px;font-family:"Fredoka";color:var(--plum2)}
/* listen & tap */
.lt{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.tile{border:3px solid var(--lilac-s);background:#fff;border-radius:16px;padding:8px 8px 4px;aspect-ratio:1/1.12;display:grid;grid-template-rows:1fr auto;transition:transform .15s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:var(--lilac)}
.tile .w{font-family:"Fredoka";font-size:15px;color:var(--sage);min-height:20px}
.tile.ok{border-color:var(--sage);background:var(--sage-s)}
.listen{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bigplay{width:84px;height:84px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#7B58AE,var(--plum));color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 #24163A,0 0 0 8px var(--lilac-s);flex:none;transition:transform .1s}
.bigplay:active{transform:translateY(5px);box-shadow:0 3px 0 #24163A,0 0 0 8px var(--lilac-s)}
.bigplay svg{width:40px;height:40px}
.bigplay.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 8px 0 #24163A,0 0 0 16px rgba(183,154,214,.35)}}
.linkb{background:none;border:0;color:var(--plum2);text-decoration:underline;font-size:15px;padding:0}
/* rule */
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.rc{border-radius:20px;padding:14px 16px;background:linear-gradient(180deg,#fff,var(--c2));border:2px solid var(--c1);position:relative;overflow:hidden}
.rc .w{font-family:"Fredoka";font-size:44px;color:var(--c1);line-height:1}
.rc .k{font-weight:700;color:var(--muted);font-size:15px}
.rc .mini{height:150px;margin:8px 0 6px;position:relative}
.rc .eg{font-weight:700}
.r1{--c1:#5B3D86;--c2:#EFE7F8}.r2{--c1:#3F7F55;--c2:#E3F1E7}.r3{--c1:#A9763A;--c2:#FAF0D9}.r4{--c1:#4E6F93;--c2:#E3ECF5}
.note{margin-top:14px;background:var(--gold-s);border-radius:16px;padding:12px 16px;border-left:6px solid var(--gold)}
.note b{color:var(--plum)}
.pairs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.pairs span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:4px 10px 4px 4px}
.pairs span i{width:38px;height:38px;display:block}
/* scene */
.scene{position:relative;aspect-ratio:16/8.4;border-radius:22px;overflow:hidden;background:#EADFF2}
.scene .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(1.5px) saturate(.9) brightness(1.05);transform:scale(1.03)}
.scene .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,246,238,.45),rgba(251,246,238,.6))}
.scene .shelf{position:absolute;right:6%;top:24%;width:34%;height:6px;border-radius:4px;background:linear-gradient(90deg,#C49A3E,#F3D98B,#C49A3E);box-shadow:0 6px 10px rgba(0,0,0,.2)}
.scene .over{position:absolute;right:16%;top:28%;background:rgba(58,36,87,.85);color:#fff;font-family:"Fredoka";font-size:14px;border-radius:99px;padding:1px 10px}
.scene .counter{position:absolute;left:0;right:0;bottom:0;height:22%;background:linear-gradient(180deg,#F3D98B,#C49A3E 30%,#8E6A2E);box-shadow:0 -6px 16px rgba(58,36,87,.25)}
.scene .you{position:absolute;left:4%;bottom:12%;width:16%;height:62%}
.scene .items{position:absolute;display:flex;align-items:flex-end;justify-content:center;gap:2%}
.scene .items.near{left:22%;bottom:14%;width:54%;height:52%}
.scene .items.far{right:9%;top:2%;width:28%;height:22.5%;align-items:flex-end;padding-bottom:0}
.scene .items .one{height:100%;aspect-ratio:1;min-width:0;max-width:33%;flex:0 1 auto;filter:drop-shadow(0 8px 6px rgba(58,36,87,.3));animation:drop .5s cubic-bezier(.2,1.4,.4,1) both}
.scene .items.far .one{filter:drop-shadow(0 3px 2px rgba(58,36,87,.3))}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.scene svg.point{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sent{font-family:"Fredoka";font-size:clamp(26px,3.4vw,36px);color:var(--plum);margin:14px 0 4px;text-align:center}
.sent .blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--gold);color:var(--sage);text-align:center}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.four button{border:0;border-radius:16px;padding:12px 0;font-family:"Fredoka";font-weight:600;font-size:24px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .1s}
.four button:active{transform:translateY(4px)}
.four .b1{background:#5B3D86}.four .b2{background:#3F7F55}.four .b3{background:#A9763A}.four .b4{background:#4E6F93}
.four button.ok{outline:4px solid var(--gold);outline-offset:3px}
.progress{display:flex;gap:5px;justify-content:center;margin-top:12px}
.progress i{width:14px;height:6px;border-radius:4px;background:var(--lilac-s)}
.progress i.ok{background:var(--sage)}.progress i.cur{background:var(--gold)}
/* rows */
.rows{display:grid}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 0;border-bottom:2px dashed var(--lilac-s)}
.row:last-child{border-bottom:0}
.row .n{width:26px;font-family:"Fredoka";color:var(--gold)}
.row .s{flex:1;min-width:220px;font-weight:700;font-size:20px}
.row .s .g{display:inline-block;min-width:80px;border-bottom:3px solid var(--plum2);text-align:center;color:var(--plum2);margin:0 4px}
.row .s .g.f{color:var(--sage);border-color:var(--sage)}
.opt{border:2px solid var(--lilac);background:#fff;border-radius:14px;padding:4px 14px;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--lilac-s)}
.opt:hover{border-color:var(--plum2)}
.opt.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.opt.dim{opacity:.3}
.optrow{display:flex;gap:8px;flex-wrap:wrap}
/* customers */
.shopchat{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:center}
.cust{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.cust .face{width:64px;height:64px;flex:none}
.bubble{background:var(--lilac-s);border-radius:18px 18px 18px 4px;padding:12px 16px;font-family:"Fredoka";font-size:22px;color:var(--plum);position:relative;animation:rise .4s both}
.bubble.me{background:var(--sage-s);border-radius:18px 18px 4px 18px;color:#2F6B45;margin-left:auto}
.choices{display:grid;gap:8px}
.choices button{text-align:left;border:2px solid var(--lilac);background:#fff;border-radius:16px;padding:10px 14px;font-family:"Fredoka";font-weight:500;font-size:20px;color:var(--plum);box-shadow:0 4px 0 var(--lilac-s)}
.choices button:hover{border-color:var(--plum2)}
.choices button.ok{background:var(--sage);border-color:var(--sage);color:#fff}
.qtag{font-weight:700;color:var(--muted);font-size:15px;margin-bottom:6px}
/* rush */
.rushtop{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--lilac-s);border-radius:14px;padding:6px 14px;font-family:"Fredoka";color:var(--plum)}
.stat b{font-size:26px;margin-right:6px}
.rushover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(58,36,87,.75);color:#fff;text-align:center;z-index:3;padding:20px}
.rushover h4{font-family:"Pacifico";font-weight:400;font-size:clamp(30px,5vw,46px);color:var(--gold-s)}
.flashok{animation:fok .45s}.flashno{animation:fno .45s}
@keyframes fok{40%{box-shadow:0 0 0 6px var(--sage)}}@keyframes fno{40%{box-shadow:0 0 0 6px var(--red)}}
/* final */
.final{text-align:center;background:#fff;border-radius:28px;padding:30px;border:2px solid var(--gold-s)}
.final h2{font-family:"Pacifico";font-weight:400;font-size:clamp(36px,5vw,54px);color:var(--plum)}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:20px 0;text-align:left}
.scores div{background:var(--lilac-s);border-radius:16px;padding:10px 14px}
.scores b{display:block;font-family:"Fredoka";font-size:26px;color:var(--plum)}
.scores span{color:var(--muted);font-size:15px}
/* teacher */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:#fff;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .3s;overflow:auto;padding:20px;font-size:16px}
.drawer.open{transform:none}
.drawer h2{color:var(--plum);font-size:28px;margin-bottom:8px}
.drawer details{border-bottom:1px solid var(--lilac-s);padding:8px 0}
.drawer summary{font-weight:700;cursor:pointer;color:var(--plum)}
.drawer p{margin:6px 0}
.shade{position:fixed;inset:0;background:rgba(43,34,54,.35);z-index:55;display:none}.shade.on{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);background:var(--plum);color:#fff;font-family:"Fredoka";padding:10px 22px;border-radius:99px;z-index:70;transition:transform .35s;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
#conf{position:fixed;inset:0;pointer-events:none;z-index:80}
body.still *,body.still *:before,body.still *:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (max-width:980px){.wrap{grid-template-columns:1fr}.railbox{position:relative;top:0}.lt{grid-template-columns:repeat(4,1fr)}.shopchat{grid-template-columns:1fr}}
@media (max-width:600px){.hero .glass{position:static;max-width:none;border-radius:0;background:#fff}.hero h1{font-size:30px}.top{position:static}.mem{grid-template-columns:repeat(3,1fr)}.lt{grid-template-columns:repeat(3,1fr)}.rules{grid-template-columns:1fr}.four{grid-template-columns:repeat(2,1fr)}.logo{font-size:22px}}
</style>
</head>

function lvFit(st){
  const t1=task('memory','1','Memory game','Переворачивай по две карточки и находи пару: <b>картинка + слово</b>. Будет два раунда по 6 пар.');
  if(S.tasksDone.has('memory'))t1.append(doneNote('memory'));else{const d=part('memory');const groups=[shuffle(WORDS).slice(0,6)];groups.push(WORDS.filter(w=>!groups[0].includes(w)));
    let round=0,moves=0;const grid=h('div',{class:'mem'}),stat=h('div',{class:'memstat'});
    const play=()=>{grid.innerHTML='';const g=groups[round];let open=[],lock=false,found=0;
      const cards=shuffle(g.flatMap(w=>[{k:w[0],t:'pic',w},{k:w[0],t:'word',w}]));
      cards.forEach(c=>{const el=h('button',{class:'mc','aria-label':'card'},h('div',{class:'in'},h('div',{class:'f',html:IC.hanger}),h('div',{class:'b'+(c.t==='word'?' word':''),html:c.t==='pic'?svgOf(c.k):c.w[1]})));
        el.onclick=()=>{if(lock||el.classList.contains('open')||el.classList.contains('got'))return;el.classList.add('open');tone('flip');open.push([el,c]);
          if(open.length===2){moves++;stat.textContent='Moves: '+moves+' · Pairs: '+(found+round*6)+' / 12';const[[a,ca],[b,cb]]=open;open=[];
            if(ca.k===cb.k&&ca.t!==cb.t){a.classList.add('got');b.classList.add('got');found++;rec('memory',0,'',null,ca.k);
              if(found===6){stat.textContent='Pairs: '+(round*6+6)+' / 12 · Moves: '+moves;if(round===0){round=1;setTimeout(()=>{toast('Round 2!');play()},900)}else{S.log.memory.extra='moves: '+moves;d()}}}
            else{lock=true;setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');lock=false},850)}}};grid.append(el)});
      stat.textContent='Round '+(round+1)+' of 2 · Moves: '+moves};
    t1.append(grid,stat);play()}
  st.append(t1);
  const t2=task('listen','2','Listen and find','Нажми на <b>фиолетовую кнопку</b> и послушай слово. Потом нажми на нужную картинку. Если звука нет, нажми «Can’t hear? Show the word».');
  if(S.tasksDone.has('listen'))t2.append(doneNote('listen'));else{const d=part('listen');const order=shuffle(WORDS);let i=0,tries=0,wrong=[],heard=false;
    const btn=h('button',{class:'bigplay pulse',html:IC.play,'aria-label':'Listen to the word'}),info=h('div',{},h('div',{style:'font-family:Fredoka;color:var(--plum);font-size:22px'},'Word 1 / 12'),h('button',{class:'linkb'},'Can’t hear? Show the word')),f=h('div',{class:'fb'});

      t.onclick=()=>{if(i>=12)return;const want=order[i];if(!heard){fb(f,'Сначала нажми фиолетовую кнопку и послушай!',false);bad(btn);return}
        if(w[0]===want[0]){t.classList.add('ok');$('.w',t).textContent=w[1];rec('listen',tries,'heard “'+want[1]+'”',wrong,w[0]);fb(f,praise()+' It’s '+(PLURAL_ONLY.has(w[0])?'':'a ')+w[1]+'.',true);i++;tries=0;wrong=[];heard=false;
          if(i>=12){info.firstChild.textContent='All 12!';btn.classList.remove('pulse');d();return}info.firstChild.textContent='Word '+(i+1)+' / 12';btn.classList.add('pulse');$('.linkb',info).textContent='Can’t hear? Show the word'}

    btn.onclick=()=>{if(i>=12)return;heard=true;btn.classList.remove('pulse');speak(order[i][1])};
    $('.linkb',info).onclick=()=>{if(i>=12)return;heard=true;$('.linkb',info).textContent=order[i][1]};

    const plan=shuffle([[0,0],[0,0],[0,0],[0,1],[0,1],[0,1],[1,0],[1,0],[1,0],[1,1],[1,1],[1,1]]);let pool=shuffle(ORDERK);
    const items=plan.map(([m,f])=>{let k;if(m){k=pool.find(x=>x)||pick(ORDERK)}else{k=pool.find(x=>!PLURAL_ONLY.has(x))||'hat'}pool=pool.filter(x=>x!==k);if(!pool.length)pool=shuffle(ORDERK);return{k,many:!!m||PLURAL_ONLY.has(k),far:!!f}});
    runScenes(t3,items,'scene',d)}

function runScenes(box,items,id,done){let i=0,tries=0,wrong=[];const holder=h('div'),sent=h('div',{class:'sent'}),four=h('div',{class:'four'}),prog=h('div',{class:'progress'},...items.map(()=>h('i'))),f=h('div',{class:'fb'});

    ['this','that','these','those'].forEach((w,j)=>four.append(h('button',{class:'b'+(j+1),onclick:e=>{const b=e.currentTarget;const want=ansOf(it.many,it.far);
      if(w===want){b.classList.add('ok');$('.blank',sent).textContent=s.startsWith('___')?w[0].toUpperCase()+w.slice(1):w;$$('i',prog)[i].classList.add('ok');
        rec(id,tries,(it.far?'far':'near')+', '+(it.many?'many ':'one ')+WORD(it.k)[it.many?2:1],wrong,it.k);fb(f,praise(),true);$$('button',four).forEach(x=>x.disabled=true);i++;setTimeout(show,1000)}
      else{tries++;wrong.push(w);bad(b);const hint=(it.far?'It’s far. ':'It’s near. ')+(it.many?'Many things.':'One thing.');fb(f,'Look again! '+(tries>1?hint:''),false)}}},w)))};
  box.append(holder,sent,four,prog,f);show()}
function rows(items,id,done){const b=h('div',{class:'rows'});let left=items.length;

/* ----- 4 rush ----- */
function lvRush(st){
  const t=task('rush','5','Shop rush','У тебя <b>60 секунд</b>! Смотри на картинку и как можно быстрее нажимай this, that, these или those. Сколько правильных ответов успеешь?');
  const sc=h('b',{},'0'),tm=h('b',{},'60'),sk=h('b',{},'0'),bs=h('b',{},String(S.best));
  const top=h('div',{class:'rushtop'},h('span',{class:'stat'},tm,'seconds'),h('span',{class:'stat'},sc,'right'),h('span',{class:'stat'},sk,'in a row'),h('span',{class:'stat'},bs,'best'));
  const area=h('div',{style:'position:relative'}),four=h('div',{class:'four'}),start=h('button',{class:'btn gold',style:'font-size:24px;padding:12px 34px'},'Start!');
  let cur=null,score=0,streak=0,left=60,iv=null,running=false,miss=[];const d=part('rush');
  const next=()=>{const many=Math.random()<.5,far=Math.random()<.5;let k=pick(ORDERK);if(!many)while(PLURAL_ONLY.has(k))k=pick(ORDERK);cur={k,many:many||PLURAL_ONLY.has(k),far};
    area.innerHTML='';const s=scene(k,cur.many,cur.far);area.append(s)};
  ['this','that','these','those'].forEach((w,j)=>four.append(h('button',{class:'b'+(j+1),onclick:()=>{if(!running)return;const want=ansOf(cur.many,cur.far);
    if(w===want){score++;streak++;tone('ok');area.classList.remove('flashok');void area.offsetWidth;area.classList.add('flashok');if(streak%5===0)confetti(40)}
    else{streak=0;tone('no');area.classList.remove('flashno');void area.offsetWidth;area.classList.add('flashno');miss.push(WORD(cur.k)[cur.many?2:1]+' ('+(cur.far?'far':'near')+') → '+want+', not '+w)}
    sc.textContent=score;sk.textContent=streak;next()}},w)));
  start.onclick=()=>{if(running)return;running=true;score=0;streak=0;left=60;miss=[];sc.textContent=0;sk.textContent=0;tm.textContent=60;start.classList.add('hidden');next();
    iv=setInterval(()=>{left--;tm.textContent=left;if(left<=5&&left>0)tone('tick');if(left<=0)end()},1000)};
  function end(){clearInterval(iv);running=false;S.best=Math.max(S.best,score);bs.textContent=S.best;S.rushRuns.push({score,miss:miss.length});
    const l=L('rush','Shop rush');l.extra='best: '+S.best+' right in 60 s';l.mist=miss.slice(-6);tone('win');confetti(120);
    area.append(h('div',{class:'rushover'},h('div',{},h('h4',{},score+' right!'),h('p',{},score>=S.best?'That’s your best score!':'Your best: '+S.best),h('p',{style:'font-size:16px;opacity:.85'},'Play again or go to “My results”.'))));
    start.textContent='Play again';start.classList.remove('hidden');$('.rushover > div',area).append(start);d()}
  stoppers.push(()=>{clearInterval(iv);running=false});
  area.append(h('div',{class:'scene',style:'display:grid;place-items:center;background:var(--lilac-s)'},h('div',{style:'font-family:Fredoka;font-size:28px;color:var(--plum);text-align:center;padding:20px;display:grid;gap:16px;justify-items:center'},'Ready?',start)));
  t.append(top,area,four);st.append(t)}

async function svgImg(svg,w,h2){return new Promise(r=>{const im=new Image();im.onload=()=>r(im);im.onerror=()=>r(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h2+'" '))})}
function wrapL(x,t,W){const o=[];let c='';for(const w of t.split(' ')){const s=c?c+' '+w:w;if(x.measureText(s).width>W&&c){o.push(c);c=w}else c=s}o.push(c);return o}
async function dlImage(){try{await document.fonts.load('400 40px Pacifico');await document.fonts.load('600 30px Fredoka');await document.fonts.load('600 20px Quicksand');await document.fonts.ready}catch(e){}
  const icons=[];for(const k of ['coat','dress','hat','jeans','trainers','skirt'])icons.push(await svgImg(svgOf(k),90,90));
  const W=1080,P=56,date=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});let rk=RANKS[0];for(const r of RANKS)if(S.n>=r[0])rk=r;
  const ids=['memory','listen','scene','isare','rush'].filter(k=>S.log[k]);
  const draw=(x,real)=>{let y=0;
    if(real){x.fillStyle='#FBF6EE';x.fillRect(0,0,W,x.canvas.height);const g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'#3A2457');g.addColorStop(1,'#5B3D86');x.fillStyle=g;x.fillRect(0,0,W,190);
      x.fillStyle='#F7EAC4';x.font='400 54px Pacifico';x.fillText('The Little Boutique',P,92);x.fillStyle='#fff';x.font='600 26px Quicksand';x.fillText('Homework answers  ·  '+date,P,140);
      icons.forEach((im,i)=>{if(im)x.drawImage(im,W-P-6*70+i*70,40,64,64)})}
    y=230;
    if(real){x.fillStyle='#fff';x.beginPath();x.roundRect(P,y,W-2*P,110,22);x.fill();x.fillStyle='#3A2457';x.font='600 54px Fredoka';x.fillText(S.n+' / '+TOTAL,P+28,y+72);
      x.font='600 26px Quicksand';x.fillStyle='#7C7088';x.fillText('things on the rail  ·  '+rk[1],P+230,y+66)}
    y+=130;
    for(const k of ids){const t=S.log[k];x.font='600 21px Quicksand';const lines=[];t.mist.slice(0,6).forEach(m=>lines.push(...wrapL(x,'• '+m,W-2*P-44)));if(t.mist.length>6)lines.push('• + '+(t.mist.length-6)+' more');
      const hh=76+lines.length*28+(lines.length?8:0);
      if(real){x.fillStyle='#fff';x.beginPath();x.roundRect(P,y,W-2*P,hh,20);x.fill();x.fillStyle='#3A2457';x.font='600 29px Fredoka';x.fillText(t.title,P+22,y+44);
        let lab,sc;if(k==='rush'){lab=S.best+' right in 60 s (best)';sc=Math.min(1,S.best/25)}else if(k==='memory'){lab=t.total+' / 12 pairs'+(t.extra?' · '+t.extra:'');sc=t.total/12}else{lab=t.total?'first try '+t.first+' / '+t.total:'not done';sc=t.total?t.first/t.total:0}
        const col=k==='memory'||k==='rush'?'#5B3D86':sc>=.8?'#4E9A62':sc>=.5?'#C49A3E':'#C8553D';x.fillStyle=col;x.font='600 27px Fredoka';x.fillText(lab,W-P-22-x.measureText(lab).width,y+44);
        x.fillStyle='#EFE7F8';x.fillRect(P+22,y+58,W-2*P-44,7);x.fillStyle=col;x.fillRect(P+22,y+58,(W-2*P-44)*sc,7);
        x.fillStyle='#6A5B72';x.font='600 21px Quicksand';lines.forEach((l,i)=>x.fillText(l,P+22,y+98+i*28))}
      y+=hh+14}
    if(!ids.length){if(real){x.fillStyle='#7C7088';x.font='600 26px Quicksand';x.fillText('No answers yet.',P,y+30)}y+=60}
    return y+30};
  const c=document.createElement('canvas');c.width=W;c.height=2400;let x=c.getContext('2d');const H=draw(x,false);c.height=H;x=c.getContext('2d');draw(x,true);
  c.toBlob(b=>{const a=h('a',{href:URL.createObjectURL(b),download:'boutique_homework_answers.png'});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)});toast('Picture saved — send it to your teacher!')}
