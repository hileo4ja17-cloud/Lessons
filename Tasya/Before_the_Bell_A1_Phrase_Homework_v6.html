h d=\"M51 18 v130\" stroke=\"#fff8eb\" stroke-width=\"5\"/><circle cx=\"51\" cy=\"33\" r=\"5\" fill=\"#d9b87d\" stroke=\"#ad875b\" stroke-width=\"1\"/><circle cx=\"51\" cy=\"52\" r=\"5\" fill=\"#d9b87d\" stroke=\"#ad875b\" stroke-width=\"1\"/><circle cx=\"51\" cy=\"71\" r=\"5\" fill=\"#d9b87d\" stroke=\"#ad875b\" stroke-width=\"1\"/><circle cx=\"51\" cy=\"90\" r=\"5\" fill=\"#d9b87d\" stroke=\"#ad875b\" stroke-width=\"1\"/><circle cx=\"51\" cy=\"109\" r=\"5\" fill=\"#d9b87d\" stroke=\"#ad875b\" stroke-width=\"1\"/><circle cx=\"51\" cy=\"128\" r=\"5\" fill=\"#d9b87d\" stroke=\"#ad875b\" stroke-width=\"1\"/><path d=\"M79 58 Q94 40 108 59 M83 91 Q99 109 113 87\" fill=\"none\" stroke=\"#fff6c9\" stroke-width=\"6\" stroke-linecap=\"round\"/></g></svg>", "book": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"160\" height=\"160\" viewBox=\"0 0 160 160\" role=\"img\" aria-label=\"book\" style=\"overflow:visible\"><ellipse cx=\"80\" cy=\"154\" rx=\"50\" ry=\"6\" fill=\"#657862\" opacity=\".13\"/><path d=\"M23 43 q32 -13 59 8 q23 -21 55 -8 v91 q-29 -15 -55 8 q-29 -20 -59 -8z\" fill=\"#a9d8e2\" stroke=\"#598c9b\" stroke-width=\"4\"/><path d=\"M82 51 v90\" stroke=\"#598c9b\" stroke-width=\"4\"/><path d=\"M40 73 q20 -5 28 2 M40 93 q20 -4 28 3 M99 73 q15 -6 27 0 M99 94 q15 -5 27 0\" stroke=\"#fff7e9\" stroke-width=\"4\" fill=\"none\" stroke-linecap=\"round\"/></svg>", "pencil": "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"160\" height=\"160\" viewBox=\"0 0 160 160\" role=\"img\" aria-label=\"pencil\" style=\"overflow:visible\"><ellipse cx=\"80\" cy=\"154\" rx=\"50\" ry=\"6\" fill=\"#657862\" opacity=\".13\"/><g transform=\"rotate(35 80 80)\"><rect x=\"59\" y=\"15\" width=\"42\" height=\"115\" rx=\"5\" fill=\"#f5cc68\" stroke=\"#d9a954\" stroke-width=\"3\"/><rect x=\"59\" y=\"15\" width=\"42\" height=\"22\" rx=\"5\" fill=\"#ed9faf\"/><path d=\"M59 128 80 155 101 128Z\" fill=\"#f2d6b5\" stroke=\"#a98b65\" stroke-width=\"2\"/><path d=\"M74 147 80 156 86 147Z\" fill=\"#3c45 const TOTAL = QUESTIONS.length;
function emptyState(){return {pos:0,retry:false,queue:[],missed:{},mistakes:0,completed:false,attempts:0};}
let st=emptyState();
try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));if(v&&typeof v==='object'&&Number.isInteger(v.pos)&&v.pos>=0&&v.pos<=TOTAL){st={...emptyState(),...v};if(!Array.isArray(st.queue))st.queue=[];if(!st.missed||typeof st.missed!=='object')st.missed={};}}catch(e){}
let selected=[],locked=false,advanceTimer=null,viewToken=0,wrongOnThisTry=false,hintOpen=false,sound=true;
const app=document.getElementById('app');
const $=id=>document.getElementById(id);
const esc=x=>String(x).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(st));}catch(e){}}
function currentIndex(){if(st.retry)return st.queue[0];return st.pos;}
function progress(){const base=st.retry?TOTAL:st.pos;return Math.round(base/TOTAL*100);}
function speak(t){if(!sound||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;u.pitch=1.02;speechSynthesis.speak(u)}catch(e){}}
function render(){viewToken++;locked=false;selected=[];wrongOnThisTry=false;hintOpen=false;const index=currentIndex();$('fill').style.width=(st.completed?100:progress())+'%';$('count').textContent=st.completed?'DONE':st.retry?`REVIEW · ${st.queue.length} left`:`${Math.min(index+1,TOTAL)} / ${TOTAL}`;if(st.completed){drawDone();return;}if(!QUESTIONS[index]){st.completed=true;save();drawDone();return;}
 const q=QUESTIONS[index],stick=IMAGES[q.mode==='find'?'backpack':q.sticker]||IMAGES.notebook;
 app.innerHTML=`<section class="board" aria-label="English homework"><div class="task-col"><div class="task-meta"><span class="chapter">${st.retry?'<span class="review-chip">TRY AGAIN</span>':esc(q.section)}</span><span class="counter">${st.retry?'↻':`✿ ${index+1} / ${TOTAL}`}</span></div><div class="situation ${q.mode==='chat'?'chat':''}"><div class="scene-text">${q.from?`<div class="who"><span class="avatar">✦</span>${esc(q.from)} says</div>`:''}<p class="context">${esc(q.scene)}</p>${q.small?`<p class="extra">${esc(q.small)}</p>`:''}</div><div class="scene-icon" aria-hidden="true"><img src="${stick}" alt=""></div></div><h2 class="question">${esc(q.cue)}</h2><div class="activity" id="activity"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="foot"><button id="hint" class="hint-button" type="button">? Help</button></div><div id="help"></div></div></section>`;
 $('hint').addEventListener('click',()=>{hintOpen=!hintOpen;$('help').innerHTML=hintOpen?'<div class="hint">Hurry up! — Поторопись!<br>We’re late! — Мы опоздали!<br>What a mess! — Какой беспорядок!<br>find — найти<br>calculator — калькулятор<br>pencil case — пенал<br>ruler — линейка</div>':'';});
 drawActivity(q);
}
function drawActivity(q){const root=$('activity');if(q.mode==='find'){
 root.innerHTML=`<div class="object-grid">${q.objects.map((v,i)=>`<button class="object-choice" type="button" data-choice="${i}" aria-label="Object ${i+1}"><span class="object-badge">${String.fromCharCode(65+i)}</span>${OBJECT_SVGS[v]}</button>`).join('')}</div>`;
 root.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(locked||b.disabled)return;if(Number(b.dataset.choice)===q.answer){b.classList.add('correct');root.querySelectorAll('button').forEach(x=>x.disabled=true);success();}else{b.classList.add('wrong');b.disabled=true;fail();}}));
 }else if(q.mode==='build'){
 root.innerHTML=`<div class="build-slot" id="slot">${selected.length?selected.map((t,j)=>`<button class="tile placed" data-remove="${j}" type="button">${esc(q.tiles[t])} ×</button>`).join(''):'<span class="placeholder">Tap the words below</span>'}</div><div class="tiles">${q.tiles.map((s,i)=>selected.includes(i)?'':`<button class="tile" type="button" data-add="${i}">${esc(s)}</button>`).join('')}</div>`;
 root.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected.push(Number(b.dataset.add));drawActivity(q);if(selected.length===q.tiles.length){const answer=selected.map(i=>q.tiles[i]);if(answer.join('\x1f')===q.answer.join('\x1f')){success();}else{fail();const nonce=viewToken;setTimeout(()=>{if(nonce!==viewToken||locked)return;selected=[];drawActivity(q);},620);}}}));
 root.querySelectorAll('[data-remove]').forEach(b=>b.addEventListener('click',()=>{if(locked)return;selected.splice(Number(b.dataset.remove),1);drawActivity(q);}));
 }else{
 root.innerHTML=`${q.mode==='vocab'?`<div class="vocab-object">${OBJECT_SVGS[q.object]}</div>`:''}<div class="choices">${q.options.map((v,i)=>`<button class="choice" type="button" data-choice="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(v)}</span></button>`).join('')}</div>`;
 root.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{if(locked||b.disabled)return;if(Number(b.dataset.choice)===q.answer){b.classList.add('correct');root.querySelectorAll('.choice').forEach(x=>x.disabled=true);success();}else{b.classList.add('wrong');b.disabled=true;fail();}}));
 }}
function fail(){st.mistakes++;wrongOnThisTry=true;const id=currentIndex();st.missed[id]=true;if(!st.queue.includes(id))st.queue.push(id);save();const fb=$('feedback');if(fb){fb.textContent='Try again!';fb.className='feedback';}}
function success(){if(locked)return;locked=true;const fb=$('feedback');if(fb){fb.textContent='✓';fb.className='feedback right';}st.attempts++;save();let nonce=viewToken;clearTimeout(advanceTimer);advanceTimer=setTimeout(()=>{if(nonce!==viewToken)return;next();},530);}
function next(){if(st.retry){const prev=st.queue.shift();if(wrongOnThisTry)st.queue.push(prev);if(st.queue.length===0){st.completed=true;} }else{st.pos++;if(st.pos>=TOTAL){if(st.queue.length)st.retry=true;else st.completed=true;}}save();render();window.scrollTo({top:0,behavior:'auto'});}
function drawDone(){$('fill').style.width='100%';$('count').textContent='DONE';const mistakes=Object.keys(st.missed).length;app.innerHTML=`<div class="done-wrap"><span class="finish-icon" aria-hidden="true">✿</span><h1 class="done-title">Well done!</h1><p class="done-note">${TOTAL} / ${TOTAL} · All done!</p><p class="quiet">${mistakes?`You practised ${mistakes} again. Nice work!`:'Perfect first try!'}</p><button type="button" class="primary" id="copy">Copy result</button><button type="button" class="primary secondary" id="again">Play again</button></div>`;$('copy').addEventListener('click',()=>{const out=`BEFORE THE BELL · A1 HOMEWORK\nCompleted: ${TOTAL}/${TOTAL}\nQuestions repeated: ${mistakes}\nWrong attempts: ${st.mistakes}`;if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(out).then(()=>{$('copy').textContent='Copied ✓';}).catch(()=>fallbackCopy(out));else fallbackCopy(out);});$('again').addEventListener('click',restart);}
function fallbackCopy(t){let x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy');$('copy').textContent='Copied ✓';}catch(e){$('copy').textContent='Screenshot your result';}x.remove()}
function restart(){clearTimeout(advanceTimer);st=emptyState();save();render();window.scrollTo({top:0,behavior:'auto'});}
$('restart').addEventListener('click',()=>{if(confirm('Start again?'))restart();});
render();
</script></body></html>
