</style></head><body><div class="wrap"><div class="journal"><header class="top"><div><div class="eyebrow">My vocabulary journal · A0–A1</div><h1>School <em>Days.</em></h1><p>20 useful words · 6 activities<br>Listen, read, remember and write.</p></div><div class="scene"><div class="book"></div><div class="pencil"></div><div class="tag">WORD<br>BOOK</div></div></header><div class="progress"><span>MY PROGRESS</span><div class="track"><div class="fill" id="bar"></div></div><span id="progressText">0 / 6</span></div><nav class="tabs" id="tabs"></nav><main id="pages"></main><div class="copyright">SCHOOL DAYS · WORD JOURNAL</div></div></div><script>
const words=[['Art','ИЗО'],['Computer Studies','информатика'],['English','английский'],['French','французский'],['Geography','география'],['History','история'],['Maths','математика'],['Music','музыка'],['P.E.','физкультура'],['Science','естествознание'],['calculator','калькулятор'],['dictionary','словарь'],['laptop','ноутбук'],['map','карта'],['paints','краски'],['pencil case','пенал'],['rubber','ластик'],['ruler','линейка'],['scissors','ножницы'],['trainers','кроссовки']];
const icons=['<path d="M8 21c6-10 12-10 18 0M16 4v12M10 10l12-6"/>','<rect x="5" y="5" width="34" height="17" rx="2"/><path d="M11 27h22M17 22v5M27 22v5"/>','<path d="M9 6h13l3 3h13v22H25l-3 3H9zM22 9v25"/>','<path d="M6 12h32M12 6v25M32 6v25"/>','<circle cx="22" cy="18" r="14"/><path d="M8 18h28M22 4c-8 8-8 20 0 28M22 4c8 8 8 20 0 28"/>','<path d="M8 7h28v25H8zM14 13h16M14 19h16M14 25h10"/>','<path d="M8 28l13-20 14 20M12 23h20"/>','<path d="M15 24V7l20-4v18M15 24c-9-5-13 8-4 9 7 1 6-6 4-9M35 21c-9-5-13 8-4 9 7 1 6-6 4-9"/>','<circle cx="22" cy="18" r="13"/><path d="M22 5l7 6-3 9H17l-4-8 9-7zM11 25l8-5M33 26l-7-6"/>','<path d="M8 28h28M11 22h22M16 22V9h12v13M20 9V4h4v5"/>','<rect x="10" y="4" width="24" height="30" rx="3"/><rect x="14" y="8" width="16" height="8"/><path d="M15 22h3m6 0h3m-12 6h3m6 0h3"/>','<path d="M8 6q9-4 14 2 7-6 15-2v26q-8-4-15 2-6-6-14-2zM22 8v26"/>','<path d="M7 28h30l-4-20H11zM4 33h36"/>','<path d="M6 9l12-4 11 4 10-4v27l-10 4-11-4-12 4zM18 5v27M29 9v27"/>','<path d="M10 31l12-22 12 22M13 26h18M6 31h32"/>','<rect x="6" y="11" width="32" height="21" rx="4"/><path d="M12 11V7h20v4M6 19h32"/>','<path d="M9 27L29 7l8 8-20 20zM23 13l8 8"/>','<path d="M6 9h32v8H6zM10 17v16M16 17v8M22 17v16M28 17v8M34 17v16"/>','<circle cx="13" cy="27" r="5"/><circle cx="33" cy="27" r="5"/><path d="M16 23L36 8M29 23L9 8"/>','<path d="M4 25q8 0 13-8l7 8q6 5 16 3v6H4zM17 17l5-4"/>'];
// Refined, recognisable illustrations for the three language/art subjects.
icons[0]='<path d="M23 6c-10-4-19 3-19 14 0 10 8 16 17 16 5 0 7-4 5-7-2-4 2-7 6-7 5 0 8-3 7-7-1-5-7-9-16-9z"/><circle cx="13" cy="16" r="2" fill="currentColor" stroke="none"/><circle cx="22" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="12" cy="25" r="2" fill="currentColor" stroke="none"/><path d="M27 31l12-19M36 10l4-5M35 13l5 2"/>';
icons[2]='<path d="M5 9q9-4 17 2 8-6 17-2v24q-9-4-17 2-8-6-17-2zM22 11v24"/><path d="M10 15h7m-7 5h7m10-5h7m-7 5h7"/><path d="M13 30l3-7 3 7m-5-2h4M28 24h6l-6 6h6"/>';
icons[3]='<path d="M20 5h4m-2 0v7m-4 0h8m-8 0c0 9-3 18-12 23m20-23c0 9 3 18 12 23M11 28h22M7 35h30M16 19h12M22 12l-7 23m7-23 7 23"/>';
const qs=[{title:'Word shelf',sub:'Listen to the words. Read each word and its meaning.'},{title:'Pick the meaning',sub:'Choose the correct Russian meaning.'},{title:'Connect the pairs',sub:'Choose the English word for each Russian word.'},{title:'Restore the words',sub:'Write the missing letters. Write the whole word.'},{title:'Listen and choose',sub:'Press Play. Which word do you hear?'},{title:'Write it in English',sub:'Translate the Russian words into English.'},{title:'School situations',sub:'Choose the right word for each sentence.'}];
const taskDefs=[{title:'Word shelf',short:'Word shelf'},{title:'01 · Meaning',short:'Meaning'},{title:'02 · Pairs',short:'Pairs'},{title:'03 · Spelling',short:'Spelling'},{title:'04 · Listening',short:'Listening'},{title:'05 · Translate',short:'Translate'},{title:'06 · In class',short:'In class'}];
let active=0,done=new Set(),choices={},sound=null;const $=id=>document.getElementById(id),norm=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.]/g,'');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function player(id){return `<button type="button" class="audio" onclick="playWord(${id})" aria-label="Play ${esc(words[id][0])}" title="Play word">▶</button>`}
function playWord(i){if(sound){sound.pause();sound.currentTime=0}if(!window.wordAudioSources||!wordAudioSources[i]){showNotice('Audio is unavailable for this word.');return}sound=new Audio(wordAudioSources[i]);sound.play().catch(()=>showNotice('The browser could not play this sound. Please try again.'))}
function showNotice(t){const n=$('notice');if(n)n.textContent=t;else alert(t)}
const meaning=[[11,['словарь','карандаш','ножницы']],[9,['история','математика','естествознание']],[19,['ноутбук','кроссовки','краски']],[4,['география','английский','музыка']],[16,['ластик','линейка','пенал']],[8,['французский','физкультура','ИЗО']],[18,['ножницы','карта','калькулятор']],[1,['информатика','естествознание','история']]];
const pairs=[14,6,15,3,12,17,5,10];
const spelling=[[11,'d_ct_on_ry'],[18,'sc_ss_rs'],[10,'c_lc_l_t_r'],[4,'G_ogr_phy'],[15,'p_nc_l c_se'],[19,'tr_in_rs'],[17,'r_l_r'],[9,'Sc_ence']];
const listening=[[11,[11,10,15]],[17,[18,17,16]],[1,[1,9,4]],[19,[19,14,12]],[5,[5,2,3]],[16,[13,16,10]]];
const translating=[14,6,15,2,12,17,3,7];
const situations=[['I draw pictures in ___ .',[0,5,8]],['I use a ___ to draw a straight line.',[13,17,11]],['I listen to songs in ___ .',[7,6,9]],['I use ___ to cut paper.',[14,19,18]],['I learn about countries in ___ .',[4,3,5]],['I keep my pens in a ___ .',[10,15,12]]];
function choice(id,prompt,options,correct,pre=''){const val=choices[id];return `<div class="question"><div class="prompt">${pre}${esc(prompt)}</div><div class="opts">${options.map((v,i)=>`<button type="button" class="opt ${val===i?'sel':''}" data-opt="${id}" data-i="${i}" onclick="choose('${id}',${i})">${esc(v)}</button>`).join('')}</div></div>`}
function field(id,prompt,placeholder='Write in English'){return `<div class="question"><div class="prompt">${esc(prompt)}</div><input class="answerInput" id="${id}" data-answer="${id}" placeholder="${placeholder}" autocomplete="off" spellcheck="false"></div>`}
function render(){const p=$('pages');$('tabs').innerHTML=taskDefs.map((t,i)=>`<button class="tab ${active===i?'active':''}" onclick="go(${i})">${done.has(i)?'✓ ':''}${t.short}</button>`).join('');let html='';if(active===0){html=`<div class="secthead"><span class="num">✎</span><div><h2>My word shelf</h2><p>First, listen and read. Tap ▶ to hear one word.</p></div></div><div class="cards">${words.map((w,i)=>`<div class="wordcard"><div class="wordicon"><svg viewBox="0 0 44 40" aria-hidden="true">${icons[i]}</svg></div><b>${esc(w[0])}</b><small>${esc(w[1])}</small><div style="margin-top:11px">${player(i)}</div></div>`).join('')}</div><div class="foot"><span class="hint">You can listen as many times as you like.</span><button class="primary" onclick="go(1)">Start activities →</button></div>`}
if(active===1)html=layout('01','Pick the meaning','Choose the correct Russian meaning.',`<div class="grid">${meaning.map(([id,opts],i)=>choice('m'+i,words[id][0],opts,opts.indexOf(words[id][1]))).join('')}</div>`,1);
if(active===2)html=layout('02','Connect the pairs','Choose the English word for each meaning.',`<div class="grid">${pairs.map((id,i)=>`<div class="question"><div class="prompt">${i+1}. ${esc(words[id][1])}</div><select class="answerSelect" id="pair${i}" data-answer="pair${i}"><option value="">Select a word…</option>${[...pairs].sort((a,b)=>words[a][0].localeCompare(words[b][0])).map(n=>`<option value="${n}">${esc(words[n][0])}</option>`).join('')}</select></div>`).join('')}</div>`,2);
if(active===3)html=layout('03','Restore the words','Write the WHOLE word, not only the missing letters.',`<div class="grid">${spelling.map(([id,mask],i)=>field('spell'+i,mask,'Type the whole word…')).join('')}</div>`,3);
if(active===4)html=layout('04','Listen and choose','Press Play and choose the word you hear.',`<div class="grid">${listening.map(([id,opts],i)=>choice('l'+i,'Which word do you hear?',opts.map(n=>words[n][0]),0,`<span class="playprompt">${player(id)} <small>TRACK ${i+1}</small></span>`)).join('')}</div><p id="notice" class="notice" role="status">Audio plays only when you press ▶.</p>`,4);
if(active===5)html=layout('05','Write it in English','Translate. Pay attention to spelling.',`<div class="grid">${translating.map((id,i)=>field('tr'+i,words[id][1])).join('')}</div>`,5);
if(active===6)html=layout('06','School situations','Choose the best word for each sentence.',`<div class="grid">${situations.map(([s,ids],i)=>choice('s'+i,s,ids.map(id=>words[id][0]),0)).join('')}</div>`,6,true);
p.innerHTML=`<section class="page">${html}</section>`;restore();$('progressText').textContent=done.size+' / 6';$('bar').style.width=(done.size/6*100)+'%'}
function layout(num,title,sub,body,idx,last=false){return `<div class="secthead"><span class="num">${num}</span><div><h2>${title}</h2><p>${sub}</p></div></div>${body}<div class="foot"><div class="feedback" id="feedback">Finish the task, then check your answers.</div><div><button class="primary secondary" onclick="check(${idx})">Check answers</button> <button class="primary" onclick="go(${idx+1})" ${last?'style="display:none"':''}>Next →</button></div></div>${last?`<div class="end" style="margin-top:27px"><div class="ornament"></div><h3>My school word journal</h3><p>Download a picture of <b>all your answers</b> and send it to your teacher.</p><button class="primary" onclick="downloadAnswers()">↓ Download my answers (PNG)</button></div>`:''}`}
function choose(id,i){choices[id]=i;document.querySelectorAll(`[data-opt="${id}"]`).forEach(x=>x.classList.toggle('sel',Number(x.dataset.i)===i));persist()}
const saved={};function persist(){document.querySelectorAll('[data-answer]').forEach(e=>saved[e.dataset.answer]=e.value)}function restore(){document.querySelectorAll('[data-answer]').forEach(e=>{if(saved[e.dataset.answer]!=null)e.value=saved[e.dataset.answer];e.addEventListener('input',persist);e.addEventListener('change',persist)})}

function check(idx){persist();let score=0,total=0;const report=(id,correct,kind)=>{total++;const el=$(id);let val=kind==='choice'?choices[id]:saved[id];let ok=kind==='choice'?val===correct:norm(val)===norm(correct);if(ok)score++;if(kind==='choice'){document.querySelectorAll(`[data-opt="${id}"]`).forEach(b=>{const n=Number(b.dataset.i);b.classList.toggle('choicegood',n===correct);b.classList.toggle('choicebad',n===val&&!ok)})}else if(el){el.classList.toggle('good',ok);el.classList.toggle('bad',!ok&&!!val)}return ok};if(idx===1)meaning.forEach(([id,opts],i)=>report('m'+i,opts.indexOf(words[id][1]),'choice'));if(idx===2)pairs.forEach((id,i)=>report('pair'+i,String(id),'text'));if(idx===3)spelling.forEach(([id],i)=>report('spell'+i,words[id][0],'text'));if(idx===4)listening.forEach((q,i)=>report('l'+i,0,'choice'));if(idx===5)translating.forEach((id,i)=>report('tr'+i,words[id][0],'text'));if(idx===6)situations.forEach((q,i)=>report('s'+i,[0,1,0,2,0,1][i],'choice'));$('feedback').textContent=`${score} / ${total} correct · ${score===total?'Lovely work!':'You can fix your answers and check again.'}`;if(score===total)done.add(idx);else done.delete(idx);$('progressText').textContent=done.size+' / 6';$('bar').style.width=(done.size/6*100)+'%';$('tabs').querySelectorAll('.tab')[idx].textContent=(done.has(idx)?'✓ ':'')+taskDefs[idx].short}
