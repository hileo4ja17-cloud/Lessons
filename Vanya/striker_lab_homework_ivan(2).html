:root{--ink:#0B1A3A;--deep:#16336E;--panel:#122B5C;--line:rgba(244,241,230,.3);--cobalt:#3F8CFF;--cyan:#FFE27A;--white:#F4F1E6;--soft:#B8C8EE;--flame:#F59A55;--goal:#A8F08F;--red:#FF9A86;--gold:#FFE27A;--wood:#24468F;--wood2:#0F2552;--magnet:#FF7A3D;--r:10px}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--ink);color:var(--white);font-family:"Nunito",system-ui,sans-serif;font-weight:500;font-size:20px;line-height:1.45;min-height:100vh;
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(47,91,255,.35),transparent 70%),repeating-linear-gradient(115deg,transparent 0 60px,rgba(79,216,255,.035) 60px 62px);background-attachment:fixed}
h1,h2,h3{font-family:"Marker","Nunito",sans-serif;font-weight:400;margin:0;line-height:1.08}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
img{max-width:100%;display:block}
.ru{display:block;color:var(--soft);font-size:15px;font-weight:500;margin-top:2px}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px clamp(12px,3vw,26px);padding-top:calc(10px + env(safe-area-inset-top,0px));background:rgba(6,10,28,.92);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 8px rgba(79,216,255,.6))}
.logo b{font-family:"Marker";font-weight:400;font-size:21px}
.logo b span{color:var(--cyan)}
.pts{margin-left:auto;font-family:"Marker";font-size:22px;color:var(--gold);background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 14px}
.pts small{font-family:"Nunito";font-size:13px;font-weight:700;color:var(--soft);margin-right:6px}
.tb{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px}
.tb[aria-pressed="false"]{opacity:.5}

main{max-width:1100px;margin:0 auto;padding:20px clamp(12px,3vw,26px) 130px}
.card{background:var(--deep);border:2px solid var(--line);border-radius:var(--r);padding:clamp(14px,2.5vw,26px)}
.inst{font-size:22px;font-weight:800;margin:0 0 16px}
.btn{border:0;border-radius:14px;padding:14px 26px;font-family:"Marker";font-size:22px;background:var(--cobalt);color:#fff;box-shadow:0 6px 0 #1A36A8;transform:;transition:transform .1s,box-shadow .1s,opacity .2s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #1A36A8}
.btn.go{background:var(--goal);color:#04210f;box-shadow:0 6px 0 #1C9A58}
.btn.ghost{background:var(--panel);box-shadow:0 6px 0 #070d26;border:2px solid var(--line)}
.btn.sm{font-size:17px;padding:10px 18px}
.btn:disabled{opacity:.35;box-shadow:none}

/* home */
.home{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(18px,3vw,40px);align-items:start}
.heroimg{border-radius:var(--r);overflow:hidden;border:2px solid var(--line);box-shadow:0 0 60px rgba(47,91,255,.35)}
.heroimg img{width:100%;aspect-ratio:1;object-fit:contain;background:#000}
.welcome h1{font-size:clamp(38px,5.4vw,62px);line-height:1;transform:;transform-origin:left}
.welcome h1 span{display:block;color:var(--cyan)}
.welcome p{font-size:19px;color:var(--soft);margin:12px 0 18px}
.list{display:grid;gap:10px;margin-top:18px}
.mi{display:grid;grid-template-columns:58px 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 14px;transition:transform .15s,border-color .15s}
.mi:hover{transform:translateX(4px);border-color:var(--cobalt)}
.mi .ico{position:relative;width:54px;height:54px}
.mi .ico img{width:100%;height:100%;object-fit:contain}
.mi .ico i{position:absolute;right:-6px;bottom:-4px;min-width:24px;height:24px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-style:normal;font-family:"Marker";font-size:13px;display:grid;place-items:center;padding:0 4px}
.mi h3{font-size:20px}
.mi .ru{font-size:14px}
.mi .st{font-weight:800;font-size:14px;color:var(--soft);white-space:nowrap}
.mi.done{border-color:rgba(55,227,139,.5)} .mi.done .st{color:var(--goal)} .mi.done .ico i{background:var(--goal);border-color:var(--goal);color:#04210f}
.mi.next{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(79,216,255,.18),0 0 30px rgba(79,216,255,.25)} .mi.next .st{color:var(--cyan)} .mi.next .ico i{background:var(--cyan);border-color:var(--cyan);color:var(--ink)}

.shead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.shead h2{font-size:clamp(26px,4vw,38px);transform:}
.shead .sic{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 0 10px rgba(79,216,255,.55))}
.back{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;font-size:16px}
.count{margin-left:auto;font-family:"Marker";color:var(--gold);font-size:20px}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none;padding:12px clamp(12px,3vw,26px) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(11,26,58,.96) 30%);display:flex;justify-content:flex-end;align-items:center;gap:14px}
.foot .btn{pointer-events:auto}
.foot .hint{color:var(--soft);font-weight:700;font-size:16px;text-align:right}
.foot .btn.ready{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #1C9A58,0 0 0 10px rgba(55,227,139,.25)}}

.fb{min-height:32px;font-weight:800;font-size:20px;margin-top:12px}
.fb.ok{color:var(--goal)} .fb.no{color:var(--red)}
.shake{animation:shake .4s} @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rule{background:rgba(79,216,255,.08);border:2px solid rgba(79,216,255,.4);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-weight:700}
.rule b{font-family:"Marker";font-weight:400;color:var(--cyan);font-size:15px;display:block;margin-bottom:4px;letter-spacing:.03em}
.rule .ex{font-weight:800;font-size:19px}
.rule .ex em{font-style:normal;color:var(--gold)}

/* 1 spelling bins */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;margin-bottom:18px}
.chip{border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:21px;background:var(--cobalt);color:#fff;box-shadow:0 4px 0 #1A36A8;touch-action:none;user-select:none}
.chip.sel{outline:3px solid var(--cyan);outline-offset:2px}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.08)}
.chip.dragging{opacity:.3}
.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bin{background:var(--panel);border:3px dashed var(--line);border-radius:16px;padding:12px;min-height:200px;transition:border-color .15s,background .15s}
.bin.hot,.bin:hover{border-color:var(--cyan);background:rgba(47,91,255,.18)}
.bin h3{font-size:22px;color:var(--cyan)}
.bin .ru{margin-bottom:8px}
.bin .got{display:flex;flex-wrap:wrap;gap:6px}
.bin .got span{background:rgba(55,227,139,.15);border:2px solid rgba(55,227,139,.6);color:var(--goal);border-radius:10px;padding:3px 10px;font-weight:800;font-size:17px}

/* 2 have/has */
.defender{width:100%;max-width:680px;margin:0 auto;background:var(--panel);border:3px solid var(--line);border-radius:20px;padding:26px;font-size:clamp(24px,3.6vw,34px);font-weight:800;min-height:130px;display:grid;place-items:center;text-align:center}
.defender.good{border-color:var(--goal)} .defender.bad{border-color:var(--red)}
.hh{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:20px}
.hh button{width:min(240px,42vw);padding:22px 0;border-radius:18px;border:0;font-family:"Marker";font-size:clamp(34px,5vw,48px);color:#fff;transform:}
.hh .hv{background:var(--cobalt);box-shadow:0 7px 0 #1A36A8}.hh .hs{background:var(--flame);box-shadow:0 7px 0 #B0431A}
.hh button:active{transform:translateY(5px);box-shadow:none}
.why{max-width:680px;margin:14px auto 0;text-align:center;color:var(--soft);font-weight:700;min-height:28px}

/* 3 shootout */
.sent{font-size:clamp(22px,3vw,30px);font-weight:800;margin-bottom:12px}
.sent .gap{color:var(--cyan);border-bottom:3px solid var(--cyan);padding:0 10px}
.sent .hintv{color:var(--soft);font-size:.7em}
.pitch{position:relative;aspect-ratio:1000/460;max-width:720px;margin:6px auto 0;container-type:inline-size;user-select:none}
.goalimg{position:absolute;inset:0;width:100%;height:100%}
.corner{position:absolute;width:36%;height:32%;border:3px dashed rgba(79,216,255,.75);border-radius:12px;background:rgba(6,10,28,.6);color:#fff;display:grid;place-items:center;font-weight:800;font-size:clamp(15px,3.6cqw,28px);text-align:center;padding:4px;transition:background .15s,transform .15s}
.corner:hover:not(:disabled){background:rgba(47,91,255,.6);transform:scale(1.04)}
.c0{left:13%;top:6%}.c1{right:13%;top:6%}.c2{left:13%;top:40%}.c3{right:13%;top:40%}
.keeper{position:absolute;left:50%;bottom:22%;width:19%;pointer-events:none;z-index:2;transform:translateX(-50%);filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));transition:left .35s cubic-bezier(.3,1.4,.5,1),bottom .35s,transform .35s}
.ball{position:absolute;pointer-events:none;z-index:3;left:50%;bottom:2%;width:11%;transform:translateX(-50%);transition:left .4s cubic-bezier(.2,.8,.3,1),bottom .4s cubic-bezier(.2,.8,.3,1),width .4s,transform .4s,opacity .2s}
.big{position:absolute;inset:0;display:grid;place-items:center;font-family:"Marker";font-size:clamp(40px,12cqw,110px);pointer-events:none;transform:;text-shadow:0 0 30px currentColor;z-index:4}
.big.pop{animation:bigpop .9s forwards}
@keyframes bigpop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}75%{opacity:1}100%{opacity:0}}
.sayit{margin-top:14px;background:rgba(55,227,139,.1);border:2px solid rgba(55,227,139,.5);border-radius:14px;padding:12px 16px}
.sayit b{display:block;color:var(--goal);font-family:"Marker";font-weight:400;font-size:15px}
.sayit .s{font-size:24px;font-weight:800}

/* 4 VAR */
.var{background:#000;border:2px solid var(--line);border-radius:16px;padding:22px;position:relative;overflow:hidden}
.var:before{content:"VAR";position:absolute;right:16px;top:10px;font-family:"Marker";font-size:16px;color:var(--red);letter-spacing:.1em}
.var .rec{position:absolute;right:62px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.tok{display:flex;flex-wrap:wrap;gap:8px;font-size:clamp(22px,3vw,30px);font-weight:800;margin-top:6px}
.tok button{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:2px 10px}
.tok button:hover:not(:disabled){border-color:var(--cyan)}
.tok button.bad{border-color:var(--flame);background:rgba(255,106,43,.2)}
.tok button.fixed{border-color:var(--goal);background:rgba(55,227,139,.2);color:var(--goal)}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 18px;font-weight:800;font-size:20px}
.opt:hover:not(:disabled){border-color:var(--cyan)}
.opt.ok{background:var(--goal);border-color:var(--goal);color:#04210f}

/* 5 type */
.trow{padding:14px 0;border-bottom:2px dashed var(--line)}
.trow:last-child{border-bottom:0}
.trow .s{font-size:23px;font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.trow .n{font-family:"Marker";color:var(--soft)}
.trow input{font:inherit;font-weight:800;font-size:22px;width:clamp(150px,22vw,230px);background:var(--panel);color:var(--white);border:2px solid var(--line);border-radius:10px;padding:4px 10px}
.trow input.ok{border-color:var(--goal);color:var(--goal)} .trow input.no{border-color:var(--red)}
.trow .base{color:var(--soft);font-size:18px}
.trow .msg{font-weight:800;font-size:17px;margin-top:6px;min-height:24px}
.trow .msg.ok{color:var(--goal)} .trow .msg.no{color:var(--flame)}
.trow .chk{margin-left:4px}

/* 6 write */
.wq{margin-bottom:16px}
.wq label{display:block;font-weight:800;font-size:21px;margin-bottom:6px}
.wq .tip{color:var(--gold);font-size:16px;font-weight:700;margin-bottom:6px}
.wq textarea{width:100%;min-height:76px;font:inherit;font-size:19px;background:var(--panel);color:var(--white);border:2px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.wq textarea.okk{border-color:rgba(55,227,139,.6)}

/* report */
.report{display:grid;gap:16px}
.rhead{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rhead img{width:110px;filter:drop-shadow(0 0 20px rgba(79,216,255,.7))}
.rhead h2{font-size:clamp(34px,6vw,60px);color:var(--goal);transform:}
.rgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.rbox{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.rbox b{display:block;font-family:"Marker";font-weight:400;font-size:28px}
.rbox span{font-size:14px;color:var(--soft);font-weight:700}
.rlist{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:17px}
.rlist h3{font-size:18px;color:var(--cyan);margin-bottom:6px}
.rlist li{margin:2px 0}
.rlist .w{color:var(--red);text-decoration:line-through}
.rlist .r{color:var(--goal);font-weight:800}

.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);visibility:hidden;z-index:60;background:var(--cobalt);padding:12px 22px;border-radius:14px;font-weight:800;transition:transform .3s}
.toast.on{transform:translate(-50%,0);visibility:visible}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,94vw);background:#0b1236;border-left:2px solid var(--line);z-index:80;transform:translateX(105%);transition:transform .3s;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px));font-size:16px}
.drawer.open{transform:none}
.drawer h2{font-size:26px;margin-bottom:8px}
.drawer details{border-bottom:1px solid var(--line);padding:8px 0}
.drawer summary{font-weight:800;cursor:pointer;color:var(--cyan)}
.prevtg{display:flex;align-items:flex-start;gap:10px;margin:10px 0;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.prevtg input{width:22px;height:22px;flex:none;margin-top:3px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:75;display:none}.shade.on{display:block}
.prevbar{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:26;background:var(--flame);color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:10px}

body.still *,body.still *:before,body.still *:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v===true?'':v)}
  for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='strikerlab_hw1';
const S={name:'',fin:'',pts:0,done:[],res:{},miss:{},write:{},sound:true,preview:false,motion:!matchMedia('(prefers-reduced-motion: reduce)').matches};
try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v)Object.assign(S,{pts:v.pts||0,done:v.done||[],res:v.res||{},miss:v.miss||{},write:v.write||{},name:v.name||'',fin:v.fin||''})}catch(e){}
const save=()=>{if(S.preview)return;try{localStorage.setItem(KEY,JSON.stringify({pts:S.pts,done:S.done,res:S.res,miss:S.miss,write:S.write,name:S.name,fin:S.fin}))}catch(e){}};
function renderPts(){$('#ptsN').textContent=S.pts}
function add(n){S.pts+=n;renderPts();save()}
/* result tracking: first-try right/total per mission + list of first-try mistakes */
let curRes=null;
function mark(ok,wrong,right){if(!curRes)return;curRes.t++;if(ok)curRes.r++;else if(wrong!=null)curRes.m.push([wrong,right]);add(ok?10:4)}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),1800)}
let AC;function sfx(k){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
  if(k==='crowd'||k==='kick'){const len=k==='crowd'?1.1:.12,buf=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=buf;f.type=k==='crowd'?'bandpass':'lowpass';f.frequency.value=k==='crowd'?900:400;g.gain.value=k==='crowd'?.3:.8;s.connect(f).connect(g).connect(AC.destination);s.start();return}
  const seq={ok:[[700,.07],[1050,.12]],no:[[200,.18]],tick:[[1200,.03]],whistle:[[2100,.12],[2300,.25]]}[k]||[[600,.1]];
  let t=t0;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=k==='no'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.9}}catch(e){}}
function bad(el){sfx('no');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function fbk(el,m,ok){el.textContent=m;el.className='fb '+(ok?'ok':'no')}
const PRAISE=['Great!','Nice one!','Clean shot!','Perfect!','That’s it!','Striker level!','Exactly!'];
const praise=()=>PRAISE[Math.random()*PRAISE.length|0];
const cv=$('#fx'),cx=cv.getContext('2d');let P=[],run=false;
function burst(n=90){if(!S.motion)return;cv.width=innerWidth;cv.height=innerHeight;const col=['#4FD8FF','#2F5BFF','#FFFFFF','#37E38B'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=4+Math.random()*10;P.push({x:innerWidth/2,y:innerHeight*.45,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,l:60+Math.random()*30,c:col[i%4],w:2+Math.random()*3})}
  if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);for(const p of P){p.vx*=.96;p.vy=p.vy*.96+.25;cx.strokeStyle=p.c;cx.lineWidth=p.w;cx.globalAlpha=Math.min(1,p.l/30);cx.beginPath();cx.moveTo(p.x,p.y);p.x+=p.vx;p.y+=p.vy;cx.lineTo(p.x,p.y);cx.stroke()}
  cx.globalAlpha=1;if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const listenBtn=get=>h('button',{class:'small listen',onclick:()=>speak(get())},'Listen');

/* 1 spelling */
function mSpell(box,api){
  const pool=h('div',{class:'pool'});const fb=h('div',{class:'fb'});
  const B=[['-s','play → plays'],['-es','after s, sh, ch, x, o'],['-ies','consonant + y → ies']];
  const bins=B.map(([t,r],k)=>h('div',{class:'bin',tabindex:0,'data-k':k},h('h3',{},'he '+t),h('span',{class:'ru'},r),h('div',{class:'got'})));
  box.append(h('div',{class:'card'},head('Put each verb in the right box. Drag it or tap the verb, then tap the box.','Перетащи глагол в нужную корзину (или нажми глагол, потом корзину).'),
    rule('THE RULE','he <em>plays</em> · he <em>watches</em> · he <em>goes</em> · he <em>studies</em>','But: play, buy, enjoy, say → vowel + y → just <em>-s</em>!'),pool,h('div',{class:'bins'},...bins),fb));
  const items=shuffle(SPELL);let left=items.length;const tries={};
  const chips=items.map(([v,f,k])=>{const c=h('button',{class:'chip','data-k':k,'data-v':v,'data-f':f},v);pool.append(c);return c});
  api.count('0 / '+left);
  let sel=null;const clear=()=>{if(sel)sel.classList.remove('sel');sel=null};
  function drop(c,z){const k=+c.dataset.k,v=c.dataset.v,f=c.dataset.f;
    if(+z.dataset.k===k){c.remove();$('.got',z).append(h('span',{},f));sfx('ok');mark(!tries[v],null,null);fbk(fb,praise()+' he '+f,true);left--;api.count((items.length-left)+' / '+items.length);if(!left)api.done()}
    else{if(!tries[v]){tries[v]=1;const zk=+z.dataset.k;curRes.m.push(['he '+(zk===0?v+'s':zk===1?v+'es':v.replace(/y$/,'')+'ies'),'he '+f])}bad(c);fbk(fb,'Not that box. Look at the end of the word!',false)}}
  chips.forEach(c=>{c.addEventListener('pointerdown',e=>{const sx=e.clientX,sy=e.clientY;let g=null;c.setPointerCapture(e.pointerId);
    const zoneAt=ev=>{const el=document.elementFromPoint(ev.clientX,ev.clientY);return el&&bins.find(z=>z===el||z.contains(el))};
    const mv=ev=>{if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){g=c.cloneNode(true);g.classList.add('ghost');g.classList.remove('sel');document.body.append(g);c.classList.add('dragging')}
      if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';bins.forEach(z=>z.classList.remove('hot'));const z=zoneAt(ev);if(z)z.classList.add('hot')}};
    const up=ev=>{c.removeEventListener('pointermove',mv);c.removeEventListener('pointerup',up);c.removeEventListener('pointercancel',up);bins.forEach(z=>z.classList.remove('hot'));
      if(g){g.remove();c.classList.remove('dragging');const z=zoneAt(ev);if(z){clear();drop(c,z)}}else{if(sel===c)clear();else{clear();sel=c;c.classList.add('sel');sfx('tick')}}};
    c.addEventListener('pointermove',mv);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up)})});
  bins.forEach(z=>z.addEventListener('click',()=>{if(sel){const c=sel;clear();drop(c,z)}}));
}

function mHH(box,api){
  const def=h('div',{class:'defender'}),why=h('div',{class:'why'});

  const B=w=>h('button',{class:w==='have'?'hv':'hs',onclick:()=>ans(w)},w.toUpperCase());
  box.append(h('div',{class:'card'},head('HAVE or HAS? Read the sentence and choose.','have или has? Прочитай и выбери.'),
    rule('THE RULE','I / you / we / they → <em>have</em>','he / she / it / one person / nobody → <em>has</em>'),def,h('div',{class:'hh'},B('have'),B('has')),why));
  const show=()=>{if(k>=deck.length){def.textContent='All defenders passed!';def.className='defender good';$$('.hh button',box).forEach(b=>b.disabled=true);why.textContent='';api.done();return}
    def.className='defender';def.textContent=deck[k][0].replace('___','____');why.textContent='';api.count((k+1)+' / '+deck.length);busy=false};
  let tried=false;
  function ans(w){if(busy)return;const[s,a,r]=deck[k];
    if(w===a.toLowerCase()){busy=true;sfx('ok');mark(!tried);def.className='defender good';def.textContent=s.replace('___',a);why.textContent=r;tried=false;setTimeout(()=>{k++;show()},1100)}
    else{if(!tried){tried=true;curRes.m.push([s.replace('___',w.replace(/^./,c=>a[0]===a[0].toUpperCase()?c.toUpperCase():c)),s.replace('___',a)])}def.className='defender bad';bad(def);why.textContent='Think: who? '+r}}
  show();
}

async function asImage(){const r=summary();try{await document.fonts.ready}catch(e){}
  const W=1200,cv=document.createElement('canvas'),c=cv.getContext('2d');
  const wrap=(t,w,font)=>{c.font=font;const words=t.split(' ');const lines=[];let l='';for(const x of words){const tt=l?l+' '+x:x;if(c.measureText(tt).width>w&&l){lines.push(l);l=x}else l=tt}if(l)lines.push(l);return lines};
  const F1='40px Marker',F2='800 24px Nunito',F3='700 22px Nunito';
  // measure height
  let H=260+120;H+=50+r.miss.length*66;H+=60;r.write.forEach(([q,a])=>{H+=34+wrap(a||'—',W-120,F3).length*30+12});H+=60;
  cv.width=W;cv.height=H;
  c.fillStyle='#0F2552';c.fillRect(0,0,W,H);c.fillStyle='#16336E';c.fillRect(16,16,W-32,H-32);
  c.strokeStyle='rgba(244,241,230,.25)';c.setLineDash([10,8]);c.lineWidth=2;c.strokeRect(30,30,W-60,H-60);c.setLineDash([]);
  let y=96;c.fillStyle='#FFE27A';c.font='54px Marker';c.fillText('STRIKER LAB HOMEWORK',60,y);
  y+=50;c.fillStyle='#F4F1E6';c.font=F2;c.fillText(r.name+'  ·  '+r.date+'  ·  '+r.pts+' points',60,y);
  y+=40;const bw=(W-120-4*16)/5;
  r.scores.forEach(([n,x],k)=>{const bx=60+k*(bw+16);c.strokeStyle='rgba(244,241,230,.4)';c.lineWidth=2;c.strokeRect(bx,y,bw,110);
    const p=x?x.r/x.t:0;c.fillStyle=!x?'#B8C8EE':p>=.8?'#A8F08F':p>=.5?'#FFE27A':'#FF9A86';c.font='44px Marker';c.textAlign='center';c.fillText(x?x.r+'/'+x.t:'—',bx+bw/2,y+58);
    c.fillStyle='#B8C8EE';c.font='700 17px Nunito';c.fillText(n,bx+bw/2,y+92);c.textAlign='left'});
  y+=170;c.fillStyle='#FFE27A';c.font=F1;c.fillText('Mistakes ('+r.miss.length+')',60,y);y+=16;
  if(!r.miss.length){y+=40;c.fillStyle='#A8F08F';c.font=F2;c.fillText('No mistakes!',60,y)}
  r.miss.forEach(([w,cr])=>{y+=34;c.fillStyle='#FF9A86';c.font=F3;c.fillText('✗ '+w,60,y);const tw=c.measureText('✗ '+w).width;c.fillRect(84,y-8,tw-24,2);
    y+=30;c.fillStyle='#A8F08F';c.font=F2;c.fillText('✓ '+cr,60,y);y+=2});
  y+=70;c.fillStyle='#FFE27A';c.font=F1;c.fillText('My interview',60,y);y+=10;
  r.write.forEach(([q,a],k)=>{y+=36;c.fillStyle='#B8C8EE';c.font='800 20px Nunito';c.fillText((k+1)+'. '+q,60,y);
    wrap(a||'—',W-120,F3).forEach(l=>{y+=30;c.fillStyle='#F4F1E6';c.font=F3;c.fillText(l,60,y)});y+=6});
  cv.toBlob(b=>{dl(b,fname('png'));toast('Image saved')},'image/png')}
async function copyText(){const t=asText();try{await navigator.clipboard.writeText(t);toast('Copied! Paste it into the chat with your teacher.')}catch(e){const ta=h('textarea',{});ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Copied!')}catch(e2){toast('Could not copy')}ta.remove()}}
function report(){cur=null;foot.classList.add('hidden');const app=$('#app');app.innerHTML='';burst(120);const r=summary();
  const boxes=r.scores.map(([n,x])=>h('div',{class:'rbox'},h('b',{style:'color:'+(x?(x.r/x.t>=.8?'var(--goal)':x.r/x.t>=.5?'var(--gold)':'var(--red)'):'var(--soft)')},x?x.r+'/'+x.t:'—'),h('span',{},n)));
  app.append(h('div',{class:'card report'},
    h('div',{class:'rhead'},h('img',{src:IMG.s_throne,alt:''}),h('div',{},h('h2',{},'Training done!'),h('div',{class:'repname'},r.name+' · '+r.date+' · '+r.pts+' points'),
      h('p',{class:'inst',style:'margin:6px 0 0'},'Download your results and send them to your teacher.',h('span',{class:'ru'},'Скачай результаты (картинку или текст) и отправь учителю.')))),
    h('div',{class:'actions'},
      h('button',{class:'btn go',onclick:asImage},'Download image'),
      h('button',{class:'btn blue',onclick:()=>dl(new Blob([asText()],{type:'text/plain;charset=utf-8'}),fname('txt'))},'Download text'),
      h('button',{class:'btn ghost',onclick:copyText},'Copy for chat'),
      h('button',{class:'btn ghost',onclick:()=>print()},'Print / PDF')),
    h('div',{class:'rgrid'},...boxes),
    h('div',{class:'rlist'},h('h3',{},'First-try mistakes ('+r.miss.length+')'),r.miss.length?h('ul',{style:'margin:0;padding-left:20px'},...r.miss.map(([w,c])=>h('li',{},h('span',{class:'w'},w),'  →  ',h('span',{class:'r'},c)))):h('p',{style:'margin:0'},'No mistakes. Wow!')),
    h('div',{class:'rlist'},h('h3',{},'My interview'),...r.write.map(([q,a])=>h('p',{style:'margin:4px 0'},h('b',{style:'color:var(--soft)'},q+' '),a||'—'))),
    h('div',{class:'actions'},
      r.miss.length?h('button',{class:'btn magnet',onclick:practice},'Practise my mistakes'):null,
      h('button',{class:'btn ghost',onclick:home},'Back to the plan'),
      h('button',{class:'btn ghost',onclick:()=>{if(confirm('Delete all results and start again?')){Object.assign(S,{pts:0,done:[],res:{},miss:{},write:{},fin:''});save();renderPts();home()}}},'Start again'))));scrollTo(0,0)}
function practice(){const app=$('#app');app.innerHTML='';const deck=shuffle(summary().miss);let i=0,ok=0;
  const q=h('div',{class:'q'}),two=h('div',{class:'two'}),fb=h('div',{class:'fb'}),cnt=h('span',{class:'count'});
  app.append(h('div',{class:'shead'},h('button',{class:'back',onclick:report},'‹ Results'),h('h2',{},'Fix your mistakes'),h('div',{class:'tools'},cnt)),
    h('div',{class:'card practice'},head('Which sentence is correct? Choose, then read it out loud.','Какое предложение правильное? Выбери и прочитай вслух.'),q,two,fb));
  const show=()=>{two.innerHTML='';fbk(fb,'',true);if(i>=deck.length){q.textContent='All fixed! '+ok+' / '+deck.length+' on the first try.';burst(80);sfx('whistle');
      two.append(h('button',{onclick:report},'Back to my results'));cnt.textContent='';return}
    cnt.textContent=(i+1)+' / '+deck.length;q.textContent='Sentence '+(i+1);let tr=0;const[w,c]=deck[i];
    shuffle([w,c]).forEach(o=>two.append(h('button',{onclick:e=>{if(o===c){sfx('ok');if(!tr)ok++;add(3);fbk(fb,praise(),true);$$('button',two).forEach(b=>b.disabled=true);e.target.style.borderColor='var(--goal)';
      two.append(h('div',{style:'display:flex;gap:10px'},h('button',{class:'btn sm',style:'text-align:center',onclick:()=>{i++;show()}},'NEXT'),listenBtn(()=>c)))}else{tr++;bad(e.target);fbk(fb,'Look at the ending again!',false)}}},o)))};
  show();scrollTo(0,0)}

/* teacher */
function teacher(){$('#drawer').innerHTML=`<h2>Teacher</h2>
<label class="prevtg"><input type="checkbox" id="prevChk"><span><b>Режим просмотра</b><br><span style="color:var(--soft);font-size:14px">NEXT всегда активна, результаты не сохраняются. Ученику не включать.</span></span></label>
<p style="color:var(--soft)">ДЗ к этапам 1–4 урока Striker Lab: окончание -s/-es/-ies, have/has, окончания времён. ~25–30 мин. В конце ученик видит отчёт: счёт с первой попытки по каждому заданию, список ошибок «было → стало» и свои ответы в задании 6 — их проверяете вы. Прогресс сохраняется в браузере.</p>
<details><summary>1. -s / -es / -ies</summary><p>-s: plays, runs, buys, enjoys, reads, says · -es: watches, goes, does, washes, finishes, fixes, misses · -ies: studies, flies, cries, carries, tidies</p></details>
<details><summary>2. have / has</summary><p>has · have · has · have · Has · have · has · Have · has · have · has · have</p></details>
<details><summary>3. Shootout</summary><p>goes · drink · is sleeping · watched · lost · ridden · tidies · hasn’t done · were · like</p><p>Ловушки 2 и 10: после doesn’t / does — без -s.</p></details>
<details><summary>4. VAR</summary><p>play→plays · have→has · likes→like · watch→watched · eat→eaten · cook→cooking · has→have · was→were</p></details>
<details><summary>5. Write the form</summary><p>lives · watches · studies · doesn’t (does not) · has · went · is raining (’s raining) · seen</p></details>
<details><summary>6. Interview</summary><p>Свободный ответ. Проверьте: -s у he/she (lives, goes, plays), has got, Past Simple (played, went), has never + 3-я форма. Засчитывается, когда в каждом ответе 4+ слова.</p></details>
<details><summary>Сброс</summary><p><button class="btn ghost sm" id="resetBtn">Reset progress</button></p></details>`;
 $('#prevChk').checked=S.preview;$('#prevChk').onchange=e=>{S.preview=e.target.checked;$('#prevBar').classList.toggle('hidden',!S.preview);if(cur!=null)setNext(!nextBtn.disabled,nextBtn.textContent)};
 $('#resetBtn').onclick=()=>{if(confirm('Reset all progress?')){Object.assign(S,{pts:0,done:[],res:{},miss:{},write:{}});try{localStorage.removeItem(KEY)}catch(e){}renderPts();home();openT(false)}}}
const openT=on=>{$('#drawer').classList.toggle('open',on);$('#shade').classList.toggle('on',on);$('#tchT').setAttribute('aria-pressed',on)};
$('#tchT').onclick=()=>openT(!$('#drawer').classList.contains('open'));$('#shade').onclick=()=>openT(false);
addEventListener('keydown',e=>{if(e.key==='Escape')openT(false)});
$('#homeBtn').onclick=home;$('#sndT').onclick=e=>{S.sound=!S.sound;e.currentTarget.setAttribute('aria-pressed',S.sound)};
document.body.classList.toggle('still',!S.motion);
$('#logoImg').src=IMG.s_fireball;teacher();renderPts();home();
</script>
