:root{
  --bg:#171614; --bg2:#1d1b18;
  --panel:#232019; --panel2:#2b271f;
  --line:#3a352c; --line2:#4b4436;
  --ink:#ece4d5; --muted:#b1a692; --faint:#867c6c;
  --teal:#41c0aa; --teal-d:#1f8074; --teal-dd:#124f48;
  --amber:#e6ad55; --amber-d:#bd852e;
  --coral:#dd7458; --coral-d:#b3543a;
  --good:#41c0aa; --bad:#dd7458;
  --r:12px; --r-s:9px;
  --shadow:0 12px 34px rgba(0,0,0,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;}
body{
  font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);font-weight:400;line-height:1.5;
  background:
    radial-gradient(130% 90% at 88% -5%, rgba(31,128,116,.12), transparent 55%),
    radial-gradient(120% 80% at 10% 0%, rgba(230,173,85,.07), transparent 50%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;min-height:100%;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:740px;margin:0 auto;padding:14px 14px 120px;}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
.pad{padding:20px;}
@media(min-width:600px){.pad{padding:26px;}}

/* top bar */
.topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(23,22,20,.97),rgba(23,22,20,.85));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;}
.topbar-in{max-width:740px;margin:0 auto;display:flex;align-items:center;gap:10px;}
.brand{font-weight:700;font-size:.98rem;letter-spacing:.2px;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--teal);box-shadow:0 0 10px var(--teal);}
.spacer{flex:1;}
.xpbox{display:flex;align-items:center;gap:8px;}
.rankpill{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-weight:600;font-size:.78rem;color:var(--amber);white-space:nowrap;}
.xpbar{width:80px;height:7px;border-radius:99px;background:#100f0d;border:1px solid var(--line);overflow:hidden;}
.xpfill{height:100%;width:0%;background:linear-gradient(90deg,var(--teal-d),var(--teal));transition:width .5s cubic-bezier(.2,.8,.2,1);}
.xpnum{font-size:.76rem;color:var(--muted);font-weight:500;white-space:nowrap;}
.iconbtn{background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:8px;width:34px;height:32px;font-size:.95rem;cursor:pointer;display:grid;place-items:center;transition:.15s;}
.iconbtn:hover{border-color:var(--teal-d);color:var(--ink);}
.iconbtn[aria-pressed="false"]{opacity:.5;}

/* steps */
.steps{display:flex;gap:5px;margin:16px 0 4px;}
.stepdot{flex:1;height:5px;border-radius:99px;background:#100f0d;border:1px solid var(--line);overflow:hidden;cursor:pointer;}
.stepdot:hover{border-color:var(--teal-d);}
.iconbtn.armed,.btn.armed{border-color:var(--coral)!important;color:var(--coral)!important;}
.stepdot.done{background:linear-gradient(90deg,var(--teal-d),var(--teal));border-color:var(--teal-d);}
.stepdot.cur{background:linear-gradient(90deg,var(--amber-d),var(--amber));border-color:var(--amber-d);}

/* type */
h1{font-weight:700;font-size:1.6rem;line-height:1.15;margin:2px 0 8px;letter-spacing:-.3px;}
h2{font-weight:700;font-size:1.28rem;margin:2px 0 10px;letter-spacing:-.2px;}
h3{font-weight:600;font-size:1.02rem;margin:0 0 6px;}
.eyebrow{color:var(--teal);font-weight:600;font-size:.76rem;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:6px;}
p{margin:0 0 12px;}
.lead{font-size:1.03rem;}
.muted{color:var(--muted);}
b,strong{font-weight:700;color:#fff;}
.k{color:var(--teal);font-weight:600;}
.tag-new{background:var(--coral);color:#2a120a;font-weight:700;font-size:.62rem;padding:2px 6px;border-radius:5px;letter-spacing:.6px;vertical-align:middle;}
.hl{background:linear-gradient(180deg,transparent 58%,rgba(230,173,85,.4) 58%);padding:0 2px;font-weight:600;color:#fff;}
.hl-t{background:linear-gradient(180deg,transparent 58%,rgba(65,192,170,.32) 58%);padding:0 2px;font-weight:600;color:#fff;}

/* buttons */
.btn{font-family:inherit;font-weight:600;font-size:.98rem;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:11px 18px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn:hover{border-color:var(--teal-d);transform:translateY(-1px);}
.btn.primary{background:linear-gradient(180deg,var(--teal),var(--teal-d));border-color:var(--teal-d);color:#062a26;}
.btn.amber{background:linear-gradient(180deg,var(--amber),var(--amber-d));border-color:var(--amber-d);color:#2a1a06;}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.btn-row.end{justify-content:flex-end;}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:5px;}

/* options */
.opts{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media(max-width:460px){.opts.grid2{grid-template-columns:1fr;}}
.opt{font-family:inherit;text-align:left;font-size:.98rem;font-weight:500;color:var(--ink);background:var(--panel);border:1.5px solid var(--line2);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.13s;display:flex;align-items:center;gap:10px;}
.opt:hover:not(:disabled){border-color:var(--teal-d);background:var(--panel2);}
.opt .tag{width:24px;height:24px;flex:none;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:.8rem;background:#100f0d;border:1px solid var(--line);color:var(--muted);}
.opt.correct{border-color:var(--good);background:rgba(65,192,170,.12);}
.opt.correct .tag{background:var(--good);color:#052;border-color:var(--good);}
.opt.wrong{border-color:var(--bad);background:rgba(221,116,88,.12);}
.opt.wrong .tag{background:var(--bad);color:#3a0f04;border-color:var(--bad);}
.opt:disabled{cursor:default;}

/* feedback */
.fb{border-radius:10px;padding:12px 14px;margin-top:12px;font-size:.95rem;border:1px solid var(--line2);background:var(--panel);animation:pop .22s ease;}
.fb.ok{border-color:var(--teal-d);background:rgba(65,192,170,.09);}
.fb.no{border-color:var(--coral-d);background:rgba(221,116,88,.09);}
.fb .why{color:var(--muted);margin-top:5px;}
.fb .why b{color:var(--ink);}
@keyframes pop{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* inputs */
.gap-inp{font-family:inherit;font-size:.98rem;font-weight:600;color:#fff;background:#120f0c;border:none;border-bottom:2px solid var(--amber);border-radius:5px 5px 0 0;padding:5px 8px;min-width:110px;text-align:center;}
.gap-inp:focus{outline:none;border-bottom-color:var(--teal);background:#151210;}
.gap-inp.ok{border-bottom-color:var(--good);color:var(--teal);}
.gap-inp.no{border-bottom-color:var(--bad);color:var(--coral);}
.mini-gap{display:inline-block;min-width:36px;border-bottom:2px dotted var(--amber);vertical-align:baseline;}
.sel{font-family:inherit;font-weight:500;font-size:.92rem;color:var(--ink);background:var(--panel);border:1.5px solid var(--line2);border-radius:9px;padding:9px 30px 9px 11px;cursor:pointer;width:100%;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 53%,calc(100% - 11px) 53%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
.sel:focus{outline:none;border-color:var(--teal);}
.sel.ok{border-color:var(--good);}
.sel.no{border-color:var(--bad);}
.sel option{background:#1b1712;color:var(--ink);}
.oc-row{display:grid;grid-template-columns:104px 1fr;gap:13px;align-items:start;padding:15px 0;border-top:1px solid var(--line);}
.oc-row:first-child{border-top:none;padding-top:4px;}
@media(max-width:520px){.oc-row{grid-template-columns:1fr;gap:8px;}}
.chip{display:inline-block;background:rgba(230,173,85,.16);border:1px solid var(--amber-d);color:var(--amber);font-weight:600;font-size:.8rem;border-radius:7px;padding:5px 9px;text-align:center;line-height:1.2;}
.oc-main .s{font-size:1.02rem;font-weight:500;margin-bottom:9px;}
.oc-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.oc-ctrl .sel{max-width:240px;}
.whybtn{font-family:inherit;font-weight:600;font-size:.84rem;color:var(--muted);background:transparent;border:1px solid var(--line2);border-radius:8px;padding:9px 13px;cursor:pointer;white-space:nowrap;}
.whybtn:hover{border-color:var(--teal-d);color:var(--ink);}
.oc-why{margin-top:9px;font-size:.9rem;color:var(--muted);background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--teal);border-radius:8px;padding:9px 12px;line-height:1.5;}
.oc-why b{color:var(--ink);}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:15px 16px;margin:11px 0;}
.qcard .qn{font-size:.68rem;font-weight:700;letter-spacing:1px;color:var(--coral);text-transform:uppercase;margin-bottom:7px;}
.qcard .qs{font-size:1.04rem;font-weight:500;margin-bottom:13px;line-height:1.5;}
.qgrid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;}
@media(max-width:560px){.qgrid{grid-template-columns:1fr;}.qgrid .chk{width:100%;}}
.qgrid .lab{font-size:.64rem;font-weight:700;letter-spacing:.8px;color:var(--faint);text-transform:uppercase;margin-bottom:5px;}
.qfb{margin-top:2px;}
.ru-help{margin-top:14px;border:1px solid var(--line2);border-radius:9px;overflow:hidden;}
.ru-help summary{cursor:pointer;list-style:none;padding:10px 13px;font-weight:600;font-size:.9rem;color:var(--muted);}
.ru-help summary::-webkit-details-marker{display:none;}
.ru-help summary::before{content:"▸ ";color:var(--teal);}
.ru-help[open] summary::before{content:"▾ ";}
.ru-help .ru-body{padding:2px 13px 13px;font-size:.9rem;color:var(--muted);line-height:1.65;}
.ru-help .ru-body b{color:var(--ink);}

/* rule strip */
.rule{display:flex;gap:13px;align-items:flex-start;background:linear-gradient(180deg,#302a20,#28231b);border:1px solid var(--amber-d);border-radius:var(--r);padding:15px 16px;margin:14px 0;}
.rule.teal{border-color:var(--teal-d);}
.rule .n{flex:none;width:34px;height:34px;border-radius:8px;background:linear-gradient(180deg,var(--amber),var(--amber-d));color:#2a1a06;display:grid;place-items:center;font-weight:700;}
.rule.teal .n{background:linear-gradient(180deg,var(--teal),var(--teal-d));color:#062a26;}
.rule .rt{font-weight:700;color:#fff;margin-bottom:2px;}
.rule .rd{color:var(--muted);font-size:.94rem;}

/* dossier cards */
.dossier{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0;}
@media(max-width:560px){.dossier{grid-template-columns:1fr;}}
.dcard{perspective:1200px;height:220px;cursor:pointer;}
.dinner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);}
.dcard.flipped .dinner{transform:rotateY(180deg);}
.dface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line2);padding:15px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel));}
.dface.back{transform:rotateY(180deg);background:linear-gradient(180deg,#2c2820,#252119);}
.dface .tname{font-weight:700;font-size:1.02rem;color:var(--amber);letter-spacing:-.2px;}
.dface .abbr{font-size:.68rem;color:var(--faint);font-weight:600;letter-spacing:1px;margin-top:2px;}
.dface .formula{margin-top:12px;background:#120f0c;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-weight:600;color:#fff;font-size:.9rem;}
.dface .when{margin-top:10px;color:var(--muted);font-size:.88rem;}
.dface .flip-hint{position:absolute;bottom:9px;right:13px;font-size:.68rem;color:var(--faint);letter-spacing:.5px;}
.dface.back .lbl{font-size:.68rem;color:var(--faint);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:0 0 4px;}
.clues{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.clue-tag{background:rgba(65,192,170,.12);border:1px solid var(--teal-dd);color:var(--teal);border-radius:6px;padding:2px 8px;font-size:.76rem;font-weight:600;}
.ex{color:var(--ink);font-size:.86rem;margin:3px 0;padding-left:13px;position:relative;}
.ex::before{content:"›";position:absolute;left:2px;color:var(--amber);}

/* signal detector */
.detector{text-align:center;}
.clue-big{font-size:1.75rem;font-weight:700;color:#fff;background:#120f0c;border:1.5px solid var(--line2);border-left:4px solid var(--amber);border-radius:10px;padding:20px 16px;margin:6px 0 4px;letter-spacing:-.3px;}
.clue-sub{color:var(--faint);font-size:.82rem;margin-bottom:12px;letter-spacing:.3px;}
.tense-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tbtn{font-family:inherit;font-weight:600;font-size:.9rem;color:var(--ink);background:var(--panel);border:1.5px solid var(--line2);border-radius:10px;padding:12px 8px;cursor:pointer;transition:.13s;line-height:1.25;}
.tbtn small{display:block;color:var(--faint);font-weight:400;font-size:.7rem;margin-top:2px;}
.tbtn:hover{border-color:var(--teal-d);}
.tbtn.correct{border-color:var(--good);background:rgba(65,192,170,.13);}
.tbtn.wrong{border-color:var(--bad);background:rgba(221,116,88,.12);}
.tricky{margin-top:12px;font-size:.84rem;color:var(--amber);background:rgba(230,173,85,.07);border:1px solid var(--amber-d);border-radius:9px;padding:9px 12px;text-align:left;}

/* reasoning */
.qsentence{font-size:1.12rem;font-weight:500;color:var(--ink);background:#120f0c;border:1px solid var(--line);border-radius:10px;padding:15px 16px;margin-bottom:4px;line-height:1.5;}
.qsentence .gap{color:var(--amber);font-weight:700;border-bottom:2px dotted var(--amber);padding:0 6px;}
.substep{margin-top:14px;}
.substep .q{font-weight:600;color:var(--muted);font-size:.9rem;margin-bottom:7px;display:flex;align-items:center;gap:7px;}
.substep .q .num{background:var(--teal-dd);color:var(--teal);border-radius:6px;width:21px;height:21px;display:grid;place-items:center;font-size:.78rem;flex:none;}
.whatif{margin-top:14px;border-top:1px dashed var(--line2);padding-top:13px;}
.whatif .lab{color:var(--amber);font-weight:600;font-size:.9rem;letter-spacing:.3px;}

/* email */
.email{background:#ece3d2;color:#2a2018;border-radius:12px;overflow:hidden;border:1px solid #b7a488;box-shadow:var(--shadow);margin:12px 0;}
.email-top{background:#3a352c;color:#e6d9c1;padding:9px 15px;font-weight:600;font-size:.86rem;letter-spacing:.2px;border-bottom:2px solid var(--amber-d);}
.email-body{padding:17px 18px;font-size:1.0rem;line-height:1.9;}
.email-body .subj{font-weight:700;margin-bottom:8px;color:#4a3620;}
.email .gap-inp{background:#fff;color:#1c130c;border-bottom-color:#bd852e;}
.email .gap-inp.ok{border-bottom-color:#1f8074;color:#12564e;}
.email .gap-inp.no{border-bottom-color:#b3543a;color:#8a2f1c;}
.email .hint-w{color:#8a6d3a;font-weight:700;cursor:pointer;user-select:none;}
.hintbox{background:#3a352c;color:#e9dcbf;border-radius:6px;padding:3px 9px;font-size:.8rem;font-weight:500;display:inline-block;margin:0 3px;}

/* teacher */
.teacher{margin-top:26px;border:1px dashed var(--line2);border-radius:var(--r);overflow:hidden;}
.teacher summary{cursor:pointer;list-style:none;padding:13px 18px;font-weight:600;color:var(--amber);background:var(--panel);display:flex;align-items:center;gap:9px;font-size:.92rem;letter-spacing:.2px;}
.teacher summary::-webkit-details-marker{display:none;}
.teacher[open] summary{border-bottom:1px solid var(--line);}
.teacher .tbody{padding:16px 18px;font-size:.9rem;color:var(--muted);}
.key{background:#120f0c;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin:9px 0;line-height:1.6;}
.key b{color:var(--teal);}
.tracker{display:grid;gap:8px;margin:10px 0;}
.trk-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;}
.trk-row .tn{font-weight:600;color:var(--ink);min-width:190px;}
.trk-row .sc{font-size:.83rem;color:var(--faint);}
.trk-set{display:flex;gap:5px;margin-left:auto;}
.trk-set button{font-family:inherit;font-size:.76rem;font-weight:600;border-radius:7px;border:1px solid var(--line2);background:#100f0d;color:var(--muted);padding:4px 9px;cursor:pointer;}
.trk-set button.on.g{background:var(--good);color:#052;border-color:var(--good);}
.trk-set button.on.a{background:var(--amber);color:#2a1a06;border-color:var(--amber);}
.trk-set button.on.r{background:var(--coral);color:#2a120a;border-color:var(--coral);}
.report{white-space:pre-wrap;background:#0f0d0a;border:1px solid var(--line);border-radius:9px;padding:12px;color:var(--ink);font-size:.86rem;margin-top:10px;min-height:20px;}

/* misc */
.center{text-align:center;}
.finaleicon{font-size:2.4rem;line-height:1;}
.win-rank{font-size:1.35rem;font-weight:700;color:var(--amber);margin:8px 0;letter-spacing:-.2px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center;}
.stat .v{font-size:1.7rem;font-weight:700;color:var(--teal);}
.stat .l{font-size:.8rem;color:var(--muted);}
.hidden{display:none!important;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand"><span class="dot"></span><span>PRESENT&nbsp;TENSES</span></div>
    <div class="spacer"></div>
    <div class="xpbox">
      <span class="rankpill" id="rankPill">Warming up</span>
      <div class="xpbar"><div class="xpfill" id="xpFill"></div></div>
      <span class="xpnum" id="xpNum">0 XP</span>
    </div>
    <button class="iconbtn" id="sndBtn" aria-pressed="true" title="Sound">♪</button>
    <button class="iconbtn" id="mtnBtn" aria-pressed="true" title="Motion">✦</button>
    <button class="iconbtn" id="resetBtn" title="Reset the lesson for a new student">↺</button>
  </div>
</div>

<div class="wrap">
  <div class="steps" id="steps"></div>
  <div id="app"></div>
  <details class="teacher">
    <summary>Teacher panel — answer keys &amp; tracker</summary>
    <div class="tbody" id="teacherBody"></div>
  </details>
</div>

<canvas id="confetti"></canvas>

<script>
"use strict";
const S={step:0,xp:0,sound:true,motion:true,
  ft:{ps:[0,0],pc:[0,0],pp:[0,0],ppc:[0,0]},
  trackerManual:{ps:null,pc:null,pp:null,ppc:null},done:{}};
const RANKS=[[0,'Warming up'],[120,'Reading signals'],[300,'Solid'],[560,'Sharp'],[860,'Confident'],[1200,'Tense Master']];
const TNAMES={ps:'Present Simple',pc:'Present Continuous',pp:'Present Perfect',ppc:'Present Perfect Continuous'};

function load(){try{const r=localStorage.getItem('mitya_present_b1');if(r)Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem('mitya_present_b1',JSON.stringify(S));}catch(e){}}
load();

/* sound */
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function beep(type){if(!S.sound)return;const c=ac();if(!c)return;
  const map={good:[[520,0],[780,.09]],bad:[[190,0]],click:[[360,0]],win:[[520,0],[660,.1],[880,.2],[1046,.3]],rank:[[440,0],[660,.12],[880,.24]]};
  (map[type]||[[400,0]]).forEach(([f,t])=>{const o=c.createOscillator(),g=c.createGain();o.type=type==='bad'?'sawtooth':'triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);
    const st=c.currentTime+t;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(type==='bad'?.13:.19,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+.22);o.start(st);o.stop(st+.24);});}

/* xp */
function rankFor(xp){let r=RANKS[0];for(const x of RANKS)if(xp>=x[0])r=x;return r;}
function nextRank(xp){for(const x of RANKS)if(xp<x[0])return x;return null;}
function addXP(n){const b=rankFor(S.xp)[1];S.xp+=n;const a=rankFor(S.xp)[1];updateXP();if(b!==a){beep('rank');burst(140);toast('New level: '+a);}save();}
function updateXP(){const r=rankFor(S.xp),nx=nextRank(S.xp);document.getElementById('rankPill').textContent=r[1];document.getElementById('xpNum').textContent=S.xp+' XP';
  let p=100;if(nx){p=Math.min(100,Math.round((S.xp-r[0])/(nx[0]-r[0])*100));}document.getElementById('xpFill').style.width=p+'%';}

let toastT;function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';
  t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;background:linear-gradient(180deg,#e6ad55,#bd852e);color:#2a1a06;font-weight:700;padding:10px 20px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center;';document.body.appendChild(t);}
  t.textContent=m;t.style.opacity='1';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity='0';},2400);}

/* confetti */
const cv=document.getElementById('confetti'),cx=cv.getContext('2d');
function sizeC(){cv.width=innerWidth;cv.height=innerHeight;}sizeC();addEventListener('resize',sizeC);
let parts=[],rafOn=false;const CCOL=['#e6ad55','#41c0aa','#dd7458','#ece4d5','#1f8074'];
function burst(n){if(!S.motion)return;for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:Math.random()*-11-3,r:Math.random()*6+3,c:CCOL[i%CCOL.length],a:1,rot:Math.random()*6,vr:(Math.random()-.5)*.4});if(!rafOn){rafOn=true;requestAnimationFrame(tick);}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a-=.011;p.rot+=p.vr;cx.save();cx.globalAlpha=Math.max(0,p.a);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r,p.r*2,p.r*2);cx.restore();});parts=parts.filter(p=>p.a>0&&p.y<cv.height+40);if(parts.length)requestAnimationFrame(tick);else{rafOn=false;cx.clearRect(0,0,cv.width,cv.height);}}

/* helpers */
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;}
function norm(s){return(s||'').toLowerCase().trim().replace(/[’`´]/g,"'").replace(/\s+/g,' ');}
function recordFT(t,ok){if(S.ft[t]){S.ft[t][1]++;if(ok)S.ft[t][0]++;save();}}

/* steps */
const STEPS=[
  {t:'Start',render:renderBrief},
  {t:'Tense map',render:renderDossier},
  {t:'Signals',render:renderDetector},
  {t:'One change',render:renderOneDetail},
  {t:'Test format',render:renderSchool},
  {t:'Past trap',render:renderTrap},
  {t:'Rebuild',render:renderRebuild},
  {t:'Final',render:renderBoss},
];
function renderSteps(){const c=document.getElementById('steps');c.innerHTML='';STEPS.forEach((s,i)=>{const d=document.createElement('div');d.className='stepdot'+(i<S.step?' done':'')+(i===S.step?' cur':'');d.title=s.t;d.setAttribute('role','button');d.setAttribute('aria-label',s.t);d.onclick=()=>{beep('click');goto(i);};c.appendChild(d);});}
function goto(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));save();renderSteps();renderTeacher();const a=document.getElementById('app');a.innerHTML='';STEPS[S.step].render(a);window.scrollTo({top:0,behavior:S.motion?'smooth':'auto'});}
function navRow(app,{back=true,next=true,nextLabel='Next →',nextEnabled=true,onNext=null}={}){
  const row=el('<div class="btn-row end"></div>');
  if(back&&S.step>0){const b=el('<button class="btn ghost">← Back</button>');b.onclick=()=>{beep('click');goto(S.step-1);};row.appendChild(b);}
  if(next){const n=el('<button class="btn primary">'+nextLabel+'</button>');n.disabled=!nextEnabled;n.onclick=()=>{beep('click');if(onNext)onNext();else goto(S.step+1);};row.appendChild(n);row._next=n;}
  app.appendChild(row);return row;}

/* ---------- STEP 0 ---------- */
function renderBrief(app){
  app.appendChild(el(`<div class="card pad">
    <div class="eyebrow">Unit 1c · Go Getter L3</div>
    <h1>You didn't fail this because it's hard.</h1>
    <p class="lead muted">You missed the signals — and wrote past tense where the whole page is about the present. That's a fixable habit. Fix it here, then re-sit the test and clear it.</p>
    <div class="rule">
      <div class="n">1</div>
      <div><div class="rt">Rule one: read the task</div>
      <div class="rd">The heading says <b>present tenses</b>. So <b>there is no past tense here</b> — every answer is about <span class="k">now</span>. The moment you reach for <i>did / was / went</i>, stop: that's the trap.</div></div>
    </div>
    <h3>See how one word flips the answer</h3>
    <p class="muted">Tap each line to reveal the fix and the signal that caused it.</p>
    <div id="hookWrap"></div>
    <div class="rule teal">
      <div class="n">2</div>
      <div><div class="rt">Rule two: hunt the signal</div>
      <div class="rd">Every sentence hides a <span class="k">signal word</span> — <i>for, since, just, already, yet, usually, now, still…</i> — and it tells you which of the <b>four</b> present tenses to use. Learn to read signals and this whole test becomes routine.</div></div>
    </div>
  </div>`));
  const hooks=[
    {bad:'I <b>did</b> a lot of things.',reason:'signal <span class="hl">for the past few weeks</span> → it\'s about duration → Present Perfect Continuous',good:'I <b>have been doing</b> a lot of things <span class="hl">for the past few weeks</span>.'},
    {bad:'I <b>had</b> a great idea.',reason:'signal <span class="hl">just</span> → fresh result, connected to now → Present Perfect',good:'I <b>have just had</b> a great idea.'},
    {bad:'<b>Did</b> I tell you my news?',reason:'news that still matters now → Present Perfect',good:'<b>Have I told</b> you my news?'},
  ];
  const hw=app.querySelector('#hookWrap');
  hooks.forEach(h=>{
    const c=el(`<button class="opt" style="flex-direction:column;align-items:stretch;">
      <div style="display:flex;gap:9px;align-items:center;"><span class="tag" style="background:rgba(221,116,88,.18);color:var(--coral);border-color:var(--coral-d);">✗</span><span style="color:var(--coral);text-decoration:line-through;text-decoration-color:rgba(221,116,88,.55);">${h.bad}</span></div>
      <div class="rev hidden" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--line2);">
        <div class="muted" style="font-size:.88rem;margin-bottom:7px;">Why: ${h.reason}</div>
        <div style="display:flex;gap:9px;align-items:center;"><span class="tag" style="background:var(--good);color:#052;border-color:var(--good);">✓</span><span>${h.good}</span></div>
      </div></button>`);
    c.onclick=()=>{const r=c.querySelector('.rev');if(r.classList.contains('hidden')){r.classList.remove('hidden');beep('click');}};
    hw.appendChild(c);
  });
  navRow(app,{back:false,nextLabel:'The four tenses →'});
}

/* ---------- STEP 1 ---------- */
const DOSSIER=[
  {ab:'ps',name:'Present Simple',formula:'V / he·she·it → V<b>-s</b>',when:'Facts, routines, timetables, states (know, like, have).',
   clues:['always','usually','often','rarely','never','every day'],
   ex:['She trains every morning.','I know what you mean.']},
  {ab:'pc',name:'Present Continuous',formula:'am / is / are + V<b>-ing</b>',when:'Happening now · temporary · a fixed future plan.',
   clues:['now','at the moment','today','this week','still','Look!'],
   ex:['Look — he\'s texting again.','We\'re meeting after school.']},
  {ab:'pp',name:'Present Perfect',formula:'have / has + V3 <span style="color:var(--faint);font-weight:400;">(3rd form)</span>',when:'A result, an experience or fresh news linked to now.',
   clues:['just','already','yet','ever','never','so far'],
   ex:['I\'ve just sent you the file.','Have you ever failed an easy test?']},
  {ab:'ppc',name:'Present Perfect Continuous',formula:'have / has + <b>been</b> + V<b>-ing</b>',when:'DURATION: started in the past and still going (or just stopped). Ask "how long?".',
   clues:['for','since','all day','lately','How long…?'],
   ex:['I\'ve been studying for this exam all week.','It\'s been raining since morning.'],new:true},
];
function renderDossier(app){
  app.appendChild(el(`<div class="card pad">
    <div class="eyebrow">Tense map</div>
    <h2>The four present tenses</h2>
    <p class="muted"><b>Tap a card</b> to flip it — the back shows the signal words and examples. Read all four, then move on.</p>
    <div class="dossier" id="dgrid"></div>
    <p class="muted" style="font-size:.88rem;margin-top:4px;"><span class="tag-new">NEW</span> Present Perfect Continuous hasn't come up in class yet — give this one extra attention.</p>
    <details class="ru-help"><summary>Explain in Russian</summary><div class="ru-body"><b>Present Simple</b> — факт, привычка, состояние. <b>Present Continuous</b> — процесс сейчас или временная ситуация. <b>Present Perfect</b> — результат к настоящему моменту (just / already / yet). <b>Present Perfect Continuous</b> — процесс начался раньше и тянется до сих пор (или только что закончился, но эффект виден): важно, <i>как долго</i> (for / since / all day / lately).</div></details>
  </div>`));
  const g=app.querySelector('#dgrid');let flipped=0;
  DOSSIER.forEach(d=>{
    const c=el(`<div class="dcard"><div class="dinner">
      <div class="dface front">
        <div class="tname">${d.name} ${d.new?'<span class="tag-new">NEW</span>':''}</div>
        <div class="abbr">${d.ab.toUpperCase()}</div>
        <div class="formula">${d.formula}</div>
        <div class="when">${d.when}</div>
        <div class="flip-hint">tap →</div>
      </div>
      <div class="dface back">
        <div class="lbl">Signal words</div>
        <div class="clues">${d.clues.map(x=>'<span class="clue-tag">'+x+'</span>').join('')}</div>
        <div class="lbl">Examples</div>
        ${d.ex.map(x=>'<div class="ex">'+x+'</div>').join('')}
      </div>
    </div></div>`);
    c.onclick=()=>{c.classList.toggle('flipped');beep('click');if(c.classList.contains('flipped')){flipped++;if(flipped>=DOSSIER.length&&!c._x){c._x=1;setTimeout(()=>{addXP(30);toast('Reference read · +30 XP');},250);}}};
    g.appendChild(c);
  });
  navRow(app,{nextLabel:'Train the signals →'});
}

/* ---------- STEP 2 ---------- */
const CLUES=[
  {c:'for three hours',t:'ppc',why:'"for + a length of time" = how long → Present Perfect Continuous.'},
  {c:'just',t:'pp',why:'"just" = fresh result → Present Perfect.'},
  {c:'every morning',t:'ps',why:'A regular routine → Present Simple.'},
  {c:'Look!',t:'pc',why:'"Look! / Listen!" = right now → Present Continuous.'},
  {c:'since Monday',t:'ppc',why:'"since + a start point" = still going → Present Perfect Continuous.'},
  {c:'already',t:'pp',why:'"already" = done before now → Present Perfect.'},
  {c:'at the moment',t:'pc',why:'"at the moment" = now → Present Continuous.'},
  {c:'usually',t:'ps',why:'Frequency / habit → Present Simple.'},
  {c:'yet',t:'pp',why:'"yet" (not… yet / …yet?) → Present Perfect.'},
  {c:'all day',t:'ppc',why:'"all day" = duration → Present Perfect Continuous.'},
];

  <div class="key"><b>Signals → tense.</b> for / since / all day / lately / How long → <b>PPC</b> · just / already / yet / ever / never / so far → <b>PP</b> · now / at the moment / still / Look! / Listen! → <b>PC</b> · always / usually / often / every day → <b>PS</b>.</div>
  <div class="key"><b>One change (verb keeps changing meaning):</b> work · am working · am working · have been working · have been working · usually work · have already finished · haven't finished yet.</div>
  <div class="key"><b>Test format:</b> knows · am trying · have just finished · has been studying · watches · are staying · has already sent · have you been doing.</div>
  <div class="key"><b>Rebuild email:</b> 1 know · 2 have been helping · 3 am spending · 4 Have I told · 5 are raising · 6 Do you have · 7 have you been doing · 8 Are you still training · 9 have just had.</div>
  <div class="key"><b>Final round:</b> plays · is writing · have sent · have been playing · Have…been · is snowing · have…been living · doesn't drink.</div>
  <div class="key"><b>State verbs (watch these):</b> know, like, have (=own), want, believe → almost always Present Simple, not the -ing form.</div>
  <h3 style="color:var(--ink);margin-top:14px;">Tracker — first-try accuracy</h3>
  <div class="tracker" id="trk"></div>
  <div class="btn-row"><button class="btn amber" id="genRep">Generate report</button><button class="btn ghost" id="resetAll">Reset progress</button></div>
  <div class="report" id="report"></div>`;
  const trk=tb.querySelector('#trk');
  ['ps','pc','pp','ppc'].forEach(ab=>{
    const[c,t]=S.ft[ab];const st=statusOf(ab);
    const row=el(`<div class="trk-row"><span class="tn">${TNAMES[ab]}${ab==='ppc'?' (NEW)':''}</span><span class="sc">${t?c+'/'+t+' correct':'no data'}</span><div class="trk-set"></div></div>`);
    const set=row.querySelector('.trk-set');
    [['g','solid'],['a','shaky'],['r','review']].forEach(([k,l])=>{const btn=el(`<button class="${k} ${st===k?'on '+k:''}">${l}</button>`);btn.onclick=()=>{S.trackerManual[ab]=(S.trackerManual[ab]===k?null:k);save();renderTeacher();};set.appendChild(btn);});
    trk.appendChild(row);});
  tb.querySelector('#genRep').onclick=()=>{
    let r='Mitya — Present Tenses (Go Getter L3, 1c)\n──────────────\n';
    ['ps','pc','pp','ppc'].forEach(ab=>{const[c,t]=S.ft[ab];const st=statusOf(ab);r+=`• ${TNAMES[ab]}: ${st?STATUS_LABEL[st].toUpperCase():'—'}${t?` (${c}/${t})`:''}\n`;});
    const weak=['ps','pc','pp','ppc'].filter(ab=>statusOf(ab)==='r'||statusOf(ab)==='a');
    r+='──────────────\nXP: '+S.xp+' · level: '+rankFor(S.xp)[1]+'\n';
    r+=weak.length?('Review first: '+weak.map(a=>TNAMES[a]).join(', ')):'All tenses solid — ready to re-sit the test.';
    tb.querySelector('#report').textContent=r;beep('click');};
  tb.querySelector('#resetAll').onclick=e=>armReset(e.currentTarget);
}

/* reset (confirm-free, two-tap) */
function resetLesson(){
  try{localStorage.removeItem('mitya_present_b1');}catch(e){}
  Object.assign(S,{step:0,xp:0,ft:{ps:[0,0],pc:[0,0],pp:[0,0],ppc:[0,0]},trackerManual:{ps:null,pc:null,pp:null,ppc:null},done:{}});
  save();updateXP();goto(0);toast('Reset done — ready for a new student');beep('click');
}
let _armed=false,_armT=null,_armBtn=null;
function armReset(btn){
  if(_armed){_armed=false;clearTimeout(_armT);if(_armBtn)_armBtn.classList.remove('armed');resetLesson();return;}
  _armed=true;_armBtn=btn;btn.classList.add('armed');toast('Tap again to reset all progress');
  _armT=setTimeout(()=>{_armed=false;btn.classList.remove('armed');},3500);
}

/* toggles + init */
const sndBtn=document.getElementById('sndBtn'),mtnBtn=document.getElementById('mtnBtn');
document.getElementById('resetBtn').onclick=e=>armReset(e.currentTarget);
function syncToggles(){sndBtn.textContent=S.sound?'♪':'♪̸';sndBtn.setAttribute('aria-pressed',S.sound);mtnBtn.textContent=S.motion?'✦':'✧';mtnBtn.setAttribute('aria-pressed',S.motion);}
sndBtn.onclick=()=>{S.sound=!S.sound;save();syncToggles();if(S.sound)beep('click');};
mtnBtn.onclick=()=>{S.motion=!S.motion;save();syncToggles();};
syncToggles();updateXP();renderSteps();renderTeacher();goto(S.step||0);
</script>
