:root{
  --plum:#3A2457;--plum2:#55377A;--plum-soft:#E9E2F2;--ink:#2B2236;
  --grey:#7E8792;--grey2:#C9CED4;--mist:#EEF0F2;--stone:#DDE1E5;
  --green:#3F8F5F;--green-d:#2C6B45;--green-soft:#DCEFE2;--moss:#7DB38A;
  --amber:#D9A24A;--red:#C0504D;--card:#fff;--r:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Baloo",system-ui,sans-serif;font-weight:500;font-size:19px;line-height:1.45;color:var(--ink);background:var(--mist);
  background-image:radial-gradient(circle at 1px 1px,rgba(58,36,87,.07) 1px,transparent 0);background-size:22px 22px;min-height:100vh}
h1,h2,h3{margin:0;font-weight:800;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:8px}
.hidden{display:none!important}
svg.ic{width:1.1em;height:1.1em;vertical-align:-.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--plum);color:#fff;box-shadow:0 6px 0 rgba(58,36,87,.15)}
.topin{max-width:1200px;margin:0 auto;padding:10px clamp(12px,3vw,26px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-size:26px;letter-spacing:.01em}
.logo svg{width:38px;height:38px}
.leafcount{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:99px;padding:3px 14px 3px 8px;font-weight:700}
.leafcount svg{width:24px;height:24px}
.title{color:#CFE9D6;font-weight:700}
.sp{flex:1}
.tb{border:2px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:99px;padding:3px 14px;font-weight:700;font-size:16px}
.tb[aria-pressed="false"]{opacity:.55}
.seasons{max-width:1200px;margin:0 auto;padding:0 clamp(12px,3vw,26px) 12px;display:flex;gap:8px;flex-wrap:wrap}
.stab{display:flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:6px 14px;background:rgba(255,255,255,.08);color:#E6DDF2;font-weight:700}
.stab svg{width:22px;height:22px}
.stab[aria-current="true"]{background:#fff;color:var(--plum)}
.stab.done{color:#BFE6CB}
.stab:disabled{opacity:.45;cursor:not-allowed}

main{max-width:1200px;margin:0 auto;padding:22px clamp(12px,3vw,26px) 80px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
/* tree panel */
.treebox{position:sticky;top:132px;border-radius:26px;overflow:hidden;background:var(--sky,#B8C3CF);transition:background 1s;box-shadow:0 18px 40px -22px rgba(43,34,54,.6)}
.treebox canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.treebox svg.tree{display:block;width:100%;height:auto;position:relative}
.treecap{position:relative;background:rgba(255,255,255,.85);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.treecap b{font-size:20px;color:var(--plum)}
.treecap span{color:var(--grey);font-weight:600;font-size:16px}
.leaf{transform-box:fill-box;transform-origin:center}
.leaf{transition:fill 1.2s ease}
.leaf.new{animation:sprout .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes sprout{from{transform:scale(0) rotate(-40deg);opacity:0}}

/* stage */
.stage{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.shead{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.shead .badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--plum);color:#fff;flex:none}
.shead .badge svg{width:36px;height:36px}
.shead h2{font-size:clamp(32px,4vw,42px);color:var(--plum)}
.shead p{margin:2px 0 0;color:var(--grey);font-weight:600}
.task{background:var(--card);border-radius:var(--r);padding:clamp(16px,2.6vw,26px);margin-bottom:20px;border:2px solid var(--stone);position:relative}
.task h3{font-size:27px;color:var(--plum);display:flex;align-items:center;gap:10px}
.task h3 .no{background:var(--green);color:#fff;border-radius:10px;font-size:17px;padding:0 10px;line-height:30px}
.inst{margin:6px 0 2px;font-weight:600}
.ru{margin:0 0 14px;color:var(--grey);font-size:16px;font-style:italic}
.task.complete{border-color:var(--moss)}
.task.complete:after{content:"Done";position:absolute;right:18px;top:16px;background:var(--green-soft);color:var(--green-d);font-weight:800;border-radius:99px;padding:0 12px;font-size:15px}
.fb{min-height:28px;font-weight:700;margin-top:10px}
.fb.ok{color:var(--green-d)}.fb.no{color:var(--red)}
.btn{border:0;border-radius:16px;padding:10px 22px;font-weight:800;font-size:19px;background:var(--plum);color:#fff;box-shadow:0 5px 0 #24163A;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #24163A}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.ghost{background:#fff;color:var(--plum);box-shadow:0 5px 0 var(--grey2);border:2px solid var(--grey2)}
.nextbar{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.say{border:2px solid var(--grey2);background:#fff;border-radius:50%;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;color:var(--plum);flex:none}
.say svg{width:18px;height:18px}

/* year wheel */
.wheel{position:relative;width:min(460px,100%);aspect-ratio:1;margin:6px auto 10px}
.wheel .hub{position:absolute;inset:30%;border-radius:50%;background:var(--plum);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:clamp(16px,2.6vw,22px);padding:10px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.slotm{position:absolute;width:19.5%;height:11.5%;transform:translate(-50%,-50%);border-radius:14px;border:2px dashed var(--grey2);background:var(--mist);display:grid;place-items:center;font-weight:800;font-size:clamp(12px,2.2vw,17px);color:var(--grey);text-align:center;line-height:1}
.slotm.fill{border-style:solid;color:#fff;border-color:transparent;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.slotm.next{border-color:var(--plum2);color:var(--plum2);background:var(--plum-soft)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--grey2);background:#fff;border-radius:14px;padding:5px 14px;font-weight:700;font-size:18px;color:var(--ink);box-shadow:0 3px 0 var(--grey2)}
.chip:hover{border-color:var(--plum2)}
.chip.sel{background:var(--plum);color:#fff;border-color:var(--plum);box-shadow:0 3px 0 #24163A}
.chip.used{visibility:hidden}
.c-winter{--c:#7E8EA3}.c-spring{--c:#5FA875}.c-summer{--c:#2F7A4C}.c-autumn{--c:#C8622A}
.slotm.fill{background:var(--c)}
/* season boxes */
.sboxes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.sbox{border:3px dashed var(--c);border-radius:18px;min-height:150px;padding:10px;background:color-mix(in srgb,var(--c) 8%,#fff);display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:transform .15s}
.sbox:hover{transform:translateY(-2px)}
.sbox .sh{display:flex;align-items:center;gap:6px;color:var(--c);font-weight:800;font-size:21px}
.sbox .sh svg{width:24px;height:24px}
.sbox .in{display:flex;flex-wrap:wrap;gap:5px}
.sbox .in span{background:var(--c);color:#fff;border-radius:10px;padding:0 9px;font-weight:700;font-size:16px;animation:pop2 .3s}
@keyframes pop2{from{transform:scale(.4)}}
/* quiz */
.qcard{background:var(--plum);color:#fff;border-radius:20px;padding:20px 22px;min-height:120px;display:flex;flex-direction:column;justify-content:center}
.qcard .qn{color:#CDBEE3;font-weight:700;font-size:16px}
.qcard .qt{font-size:clamp(24px,3vw,32px);font-weight:800;line-height:1.15}
.qcard .qt .blank{display:inline-block;min-width:100px;border-bottom:4px solid #9FD2AE;margin:0 4px}
.opts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.opts3 button,.optrow button{border:2px solid var(--grey2);background:#fff;border-radius:16px;padding:10px 12px;font-weight:700;font-size:19px;box-shadow:0 4px 0 var(--grey2)}
.opts3 button:hover,.optrow button:hover{border-color:var(--plum2)}
button.ok{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important;box-shadow:0 4px 0 var(--green-d)!important}
button.dim{opacity:.35}
.streak{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.streak i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.streak i.on{background:#9FD2AE}
.rows{display:grid}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 0;border-bottom:2px dashed var(--stone)}
.row:last-child{border-bottom:0}
.row .n{width:26px;font-weight:800;color:var(--green)}
.row .s{flex:1;min-width:220px;font-weight:700;font-size:20px}
.row .s .g{display:inline-block;min-width:96px;border-bottom:3px solid var(--plum2);text-align:center;color:var(--plum2);margin:0 4px}
.row .s .g.f{color:var(--green-d);border-color:var(--green)}
.optrow{display:flex;flex-wrap:wrap;gap:8px}
.optrow button{font-size:17px;padding:5px 13px}
/* family table */
.fam{width:100%;border-collapse:separate;border-spacing:0;border-radius:16px;overflow:hidden;border:2px solid var(--stone);margin-bottom:14px}
.fam th,.fam td{padding:8px 10px;text-align:center;border-bottom:2px solid var(--stone)}
.fam tr:last-child td{border-bottom:0}
.fam th{background:var(--plum);color:#fff;font-weight:700;font-size:17px}
.fam td:first-child{text-align:left;font-weight:800;color:var(--plum)}
.fam td svg{width:26px;height:26px}
.yes{color:var(--green)}.no{color:var(--red)}
.famwrap{position:sticky;top:132px;z-index:2;background:#fff;padding-top:4px}
/* card maker */
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.f{display:grid;gap:4px;margin-bottom:12px;font-weight:700}
.f select,.f input{font:inherit;font-weight:600;border:2px solid var(--grey2);border-radius:12px;padding:6px 10px;background:#fff;color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:2px solid var(--grey2);background:#fff;border-radius:12px;padding:3px 11px;font-weight:700;font-size:16px}
.tg[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.mycard{border-radius:22px;padding:22px;color:#fff;background:linear-gradient(150deg,#3A2457,#55377A 60%,#2F6B4A);position:relative;overflow:hidden;min-height:300px}
.mycard h4{margin:0 0 8px;font-size:30px;font-weight:800;color:#CFE9D6}
.mycard p{margin:4px 0;font-size:20px;font-weight:600}
.mycard b{color:#FFE2A8}
.mycard svg.deco{position:absolute;right:-20px;bottom:-20px;width:170px;height:170px;opacity:.25}
/* finale */
.finale{text-align:center;background:var(--card);border-radius:26px;padding:30px;border:2px solid var(--stone)}
.finale h2{font-size:clamp(36px,5vw,52px);color:var(--plum)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0;text-align:left}
.score div{border-radius:14px;background:var(--mist);padding:10px 14px}
.score b{display:block;font-size:24px;color:var(--plum)}
.score span{color:var(--grey);font-weight:600;font-size:15px}
.dl{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
/* teacher drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:#fff;z-index:60;box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .3s;overflow:auto;padding:20px;font-size:16px;font-weight:500}
.drawer.open{transform:none}
.drawer h2{color:var(--plum);font-size:30px;margin-bottom:8px}
.drawer details{border-bottom:1px solid var(--stone);padding:8px 0}
.drawer summary{font-weight:800;cursor:pointer;color:var(--plum)}
.drawer p{margin:6px 0}
.shade{position:fixed;inset:0;background:rgba(43,34,54,.35);z-index:55;display:none}.shade.on{display:block}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,160%);background:var(--plum);color:#fff;font-weight:800;padding:10px 22px;border-radius:99px;z-index:70;transition:transform .35s;visibility:hidden}
.toast.on{transform:translate(-50%,0);visibility:visible}
body.still *,body.still *:before,body.still *:after{animation-duration:.001ms!important;transition-duration:.001ms!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
@media (max-width:920px){
  main{grid-template-columns:1fr}
  .treebox{position:relative;top:0;order:-1;max-width:420px;width:100%;margin:0 auto}
  .maker{grid-template-columns:1fr}
  .sboxes{grid-template-columns:repeat(2,1fr)}
  .famwrap{top:0;position:static}
}
@media (max-width:560px){
  .top{position:static}
  .opts3{grid-template-columns:1fr}
  .seasons{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .stab{white-space:nowrap;flex:none}
  .treebox{max-width:250px}
  .tb{padding:2px 10px;font-size:14px}
  .logo h1{font-size:22px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo" id="logo"></div>
    <span class="leafcount" id="lc"></span>
    <span class="title" id="ttl">Seed</span>
    <span class="sp"></span>
    <button class="tb" id="sndT" aria-pressed="true">Sound</button>
    <button class="tb" id="motT" aria-pressed="true">Motion</button>
    <button class="tb" id="tchT" aria-pressed="false">Teacher</button>
  </div>
  <nav class="seasons" id="tabs" aria-label="Levels"></nav>
</header>
<main>
  <div id="app"></div>
  <aside class="treebox" id="treebox" aria-label="Your tree"><canvas id="fx"></canvas><svg class="tree" id="tree" viewBox="0 0 300 330" role="img" aria-label="A tree that grows when you answer correctly"></svg>
    <div class="treecap"><b id="tcap">Winter</b><span id="tleaves">0 / 60 leaves</span></div></aside>
</main>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-label="Teacher panel"></aside>
<div class="toast" id="toast"></div>
<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function h(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{})){if(x==='class')e.className=v;else if(x==='html')e.innerHTML=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v===true?'':v)}
  for(const c of k.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const SEASON_OF=m=>['winter','winter','spring','spring','spring','summer','summer','summer','autumn','autumn','autumn','winter'][MONTHS.indexOf(m)];
const IC={
 snow:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2M4 10.5l3.5-.3L6 7M20 13.5l-3.5.3L18 17M4 13.5l3.5.3L6 17M20 10.5l-3.5-.3L18 7"/></svg>',
 flower:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="9" r="2.4"/><path d="M12 6.6c0-2.6 1-4 2.3-4s2 1.6 1 3.4M14.3 8.2c2.4-1 4.1-.6 4.4.7s-1 2.4-3 2.2M13.6 11.2c1.8 1.9 2 3.6.9 4.4s-2.6 0-3.2-1.9M10.4 11.2c-1.8 1.9-2 3.6-.9 4.4M9.7 8.2C7.3 7.2 5.6 7.6 5.3 8.9s1 2.4 3 2.2M12 6.6c0-2.6-1-4-2.3-4s-2 1.6-1 3.4M12 11.4V22M12 18c-2-2.5-4.5-3-6-2.5M12 19c2-2 4-2.4 5.5-2"/></svg>',
 sun:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>',
 leaf:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 19c0-9 6-14 15-15-1 9-6 15-15 15z"/><path d="M5 19l8-8"/></svg>',
 star:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>',
 speak:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
 check:'<svg class="ic" viewBox="0 0 24 24" style="stroke-width:3"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 cross:'<svg class="ic" viewBox="0 0 24 24" style="stroke-width:3"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 lock:'<svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
 tree:'<svg viewBox="0 0 40 40"><circle cx="20" cy="15" r="11" fill="#7DB38A"/><circle cx="13" cy="18" r="7" fill="#5FA875"/><circle cx="27" cy="18" r="7" fill="#8A6BB0"/><path d="M20 22v14M20 28l-5-4M20 26l5-4" stroke="#EDE6F5" stroke-width="3" stroke-linecap="round"/></svg>'};
const SEASON_IC={winter:IC.snow,spring:IC.flower,summer:IC.sun,autumn:IC.leaf};

const S={leaves:0,sound:true,motion:!matchMedia('(prefers-reduced-motion: reduce)').matches,level:0,done:new Set(),teacher:false,log:{},card:null,tasksDone:new Set()};
let AC;function tone(k){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const seq={ok:[[740,.08],[988,.14]],no:[[200,.13]],pop:[[1200,.04]],level:[[523,.1],[659,.1],[784,.1],[1046,.25]]}[k]||[[600,.1]];
  let t=AC.currentTime;for(const[f,d]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=k==='no'?'triangle':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.13,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d+.1);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.12);t+=d*.85}}catch(e){}}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const sayB=t=>h('button',{class:'say','aria-label':'Listen: '+t,title:'Listen',html:IC.speak,onclick:e=>{e.stopPropagation();speak(t)}});
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2300)}
function bad(el){tone('no');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function fb(el,m,ok){el.textContent=m;el.className='fb '+(ok?'ok':'no')}
const PRAISE=['Great!','Well done!','Yes!','Super!','Brilliant!','Perfect!','You got it!'];const praise=()=>PRAISE[Math.random()*PRAISE.length|0];
/* log: per task */
function L(id,title){return S.log[id]=S.log[id]||{title,first:0,total:0,mist:[]}}
function rec(id,tries,label,wrong){const l=S.log[id];l.total++;if(!tries)l.first++;if(wrong&&wrong.length)l.mist.push(label+' — tried: '+wrong.join(', '));grow();if($('#drawer').classList.contains('open'))renderTeacher()}

/* ============ tree ============ */
const SKY={winter:'linear-gradient(#AEB9C7,#DDE3EA)',spring:'linear-gradient(#BFD9C6,#EEF4E8)',summer:'linear-gradient(#8FC3A0,#E3F0D9)',autumn:'linear-gradient(#E3A86A,#F7E4C6)',final:'linear-gradient(#EFC27C,#FBEFD8)'};
const SKYC={winter:['#AEB9C7','#DDE3EA'],spring:['#BFD9C6','#EEF4E8'],summer:['#8FC3A0','#E3F0D9'],autumn:['#E3A86A','#F7E4C6'],final:['#EFC27C','#FBEFD8']};
const GROUND={winter:'#F2F4F7',spring:'#8CC79A',summer:'#4E9A62',autumn:'#B98450',final:'#B79A55'};
const LEAFC={winter:['#FFFFFF','#E9EEF4','#D9E1EA'],spring:['#8FD19E','#6FBF84','#B9A3D9','#A8DDB4','#FFFFFF'],summer:['#2F7A4C','#3F8F5F','#4FA36C','#256B40','#5DB077'],
  autumn:['#F2C14E','#E8913A','#D9622B','#B8392B','#F0A63A','#C94A2A'],final:['#F2C14E','#E8913A','#D9622B','#B8392B','#F0A63A','#C94A2A']};
let curSeason='winter';
const leafColor=(i,se)=>{const p=LEAFC[se]||LEAFC.summer;return p[(i*7+3)%p.length]};
function recolor(se){$$('#leaves ellipse').forEach((e,i)=>e.setAttribute('fill',leafColor(i,se)))}
let SLOTS=[];let rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647})();
function buildTree(){const svg=$('#tree');let br='';SLOTS=[];
  const branch=(x,y,len,ang,depth,w)=>{const x2=x+len*Math.cos(ang),y2=y+len*Math.sin(ang);br+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}" stroke="#5B4A6B" stroke-width="${w}" stroke-linecap="round"/>`;
    if(depth>=2)for(let k=0;k<(depth===4?6:4);k++){const a=ang+(rnd()-.5)*2.6,d=6+rnd()*22;SLOTS.push([x2+Math.cos(a)*d*.6,y2+Math.sin(a)*d*.6,(a*57)|0])}
    if(depth<4){branch(x2,y2,len*.72,ang-.42-rnd()*.25,depth+1,w*.66);branch(x2,y2,len*.72,ang+.42+rnd()*.25,depth+1,w*.66);if(depth<2)branch(x2,y2,len*.6,ang+(rnd()-.5)*.3,depth+1,w*.6)}};
  branch(150,300,78,-Math.PI/2,0,14);
  SLOTS=SLOTS.filter(([x,y])=>y<235).sort((a,b)=>(a[1]-b[1])||(a[0]-b[0]));
  /* spread evenly: pick 60 from available */
  const pick=[];const n=SLOTS.length;for(let i=0;i<60;i++)pick.push(SLOTS[Math.floor(i*n/60)]);
  {const cand=shuffleSeeded(SLOTS);let out=[];for(const md of [13,11,9,7,5,0]){out=[];for(const c of cand){if(out.every(o=>Math.hypot(o[0]-c[0],o[1]-c[1])>=md))out.push(c);if(out.length===60)break}if(out.length===60)break}
   SLOTS=shuffleSeeded(out)}
  svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.innerHTML=`<ellipse id="ground" cx="150" cy="312" rx="150" ry="30" fill="#F2F4F7"/>${br}<g id="leaves"></g>`;}
function shuffleSeeded(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=(rnd()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function grow(){if(S.leaves>=60)return;const [x,y,r]=SLOTS[S.leaves];const c=leafColor(S.leaves,curSeason);
  const NS='http://www.w3.org/2000/svg';const wrap=document.createElementNS(NS,'g');wrap.setAttribute('transform',`rotate(${r} ${x.toFixed(1)} ${y.toFixed(1)})`);
  const g=$('#leaves');const el=document.createElementNS(NS,'ellipse');el.setAttribute('cx',x.toFixed(1));el.setAttribute('cy',y.toFixed(1));el.setAttribute('rx','11');el.setAttribute('ry','6.2');el.setAttribute('stroke','rgba(58,36,87,.28)');el.setAttribute('stroke-width','.8');
  el.setAttribute('fill',c);el.setAttribute('class','leaf new');wrap.append(el);g.append(wrap);
  S.leaves++;tone('ok');renderTop()}
function setSeason(se){const b=$('#treebox');b.style.setProperty('--sky','');b.style.background=SKY[se];$('#ground').setAttribute('fill',GROUND[se]);curSeason=se;recolor(se);
  $('#tcap').textContent=se==='final'?'Your Season Tree':se[0].toUpperCase()+se.slice(1);fxMode=se}
/* particles in the tree box */
const cv=$('#fx'),cx=cv.getContext('2d');let fxMode='winter',parts=[];
function fxLoop(){const W=cv.width=cv.clientWidth*devicePixelRatio,H=cv.height=cv.clientHeight*devicePixelRatio;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,W,H);
  if(S.motion){if(parts.length<40&&Math.random()<.3)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*.6,vy:.5+Math.random()*1.2,r:2+Math.random()*3,a:Math.random()*6,life:0});
    for(const p of parts){p.x+=p.vx+Math.sin(p.a+=.03)*.4;p.y+=p.vy*devicePixelRatio;p.life++;
      cx.beginPath();if(fxMode==='winter'){cx.fillStyle='rgba(255,255,255,.85)';cx.arc(p.x,p.y,p.r*devicePixelRatio,0,7)}
      else if(fxMode==='spring'){cx.fillStyle='rgba(185,163,217,.8)';cx.ellipse(p.x,p.y,p.r*1.6*devicePixelRatio,p.r*devicePixelRatio,p.a,0,7)}
      else if(fxMode==='summer'){p.vy=-.2;cx.fillStyle=`rgba(255,240,170,${.4+.4*Math.sin(p.a*3)})`;cx.arc(p.x,H-p.y,p.r*.8*devicePixelRatio,0,7)}
      else if(fxMode==='autumn'){if(!p.c)p.c=['#F2C14E','#E8913A','#D9622B','#B8392B'][Math.random()*4|0];cx.fillStyle=p.c;cx.ellipse(p.x,p.y,p.r*2*devicePixelRatio,p.r*devicePixelRatio,p.a,0,7)}
      else{cx.fillStyle='rgba(255,226,168,.9)';cx.arc(p.x,p.y,p.r*.7*devicePixelRatio,0,7)}
      cx.fill()}
    parts=parts.filter(p=>p.y<H+20&&p.y>-40&&p.life<900)}
  requestAnimationFrame(fxLoop)}

/* ============ top ============ */
const TITLES=[[0,'Seed'],[10,'Sprout'],[25,'Sapling'],[45,'Young Tree'],[60,'Season Keeper']];
function renderTop(){$('#lc').innerHTML=IC.leaf.replace('class="ic"','class="ic" style="width:22px;height:22px;color:#9FD2AE"')+' '+S.leaves;
  let t=TITLES[0];for(const x of TITLES)if(S.leaves>=x[0])t=x;const old=$('#ttl').textContent;$('#ttl').textContent=t[1];if(old!==t[1]&&S.leaves)toast('Your tree is now a '+t[1]+'!');
  $('#tleaves').textContent=S.leaves+' / 60 leaves'}
function renderTabs(){const n=$('#tabs');n.innerHTML='';LEVELS.forEach((l,i)=>{const open=S.teacher||i===0||i===LEVELS.length-1||S.done.has(LEVELS[i-1].id);
  n.append(h('button',{class:'stab'+(S.done.has(l.id)?' done':''),'aria-current':String(i===S.level),disabled:!open,html:(open?(SEASON_IC[l.season]||IC.star):IC.lock)+`<span>${l.name}</span>`,onclick:()=>go(i)}))})}

/* ============ levels ============ */
const LEVELS=[
 {id:'winter',season:'winter',name:'Winter · Months',title:'Winter: the twelve months',sub:'Put the months in order and find their seasons.',build:lvWinter},
 {id:'spring',season:'spring',name:'Spring · Month puzzles',title:'Spring: month puzzles',sub:'Think, read carefully and choose.',build:lvSpring},
 {id:'summer',season:'summer',name:'Summer · have got',title:'Summer: have got, has got',sub:'Look at the table and talk about the Green family.',build:lvSummer},
 {id:'autumn',season:'autumn',name:'Autumn · to be & me',title:'Autumn: am, is, are — and you!',sub:'Remember the verb to be. Then make your own season card.',build:lvAutumn},
 {id:'final',season:'final',name:'My tree',title:'Your Season Tree',sub:'Look at your tree! Download your results for your teacher.',build:lvFinal}];
let need=0;function part(id){need++;let d=false;return()=>{if(d)return;d=true;S.tasksDone.add(id);const t=$('#t_'+id);t&&t.classList.add('complete');if(--need===0)levelDone()}}
function levelDone(){const l=LEVELS[S.level];if(S.done.has(l.id))return;S.done.add(l.id);tone('level');renderTabs();

      if(real){const g=x.createLinearGradient(P,y,W-P,y+hgt);g.addColorStop(0,'#3A2457');g.addColorStop(1,'#2F6B4A');x.fillStyle=g;x.beginPath();x.roundRect(P,y,W-2*P,hgt,18);x.fill();
        x.fillStyle='#CFE9D6';x.font='800 28px Baloo, sans-serif';x.fillText('My season card',P+20,y+42);x.fillStyle='#fff';x.font='600 24px Baloo, sans-serif';L.forEach((l,i)=>x.fillText(l,P+20,y+80+i*34))}
      y+=hgt+14}
    return y+30};
  const c=document.createElement('canvas');c.width=W;c.height=2000;let x=c.getContext('2d');const H=draw(x,false);c.height=H;x=c.getContext('2d');draw(x,true);
  c.toBlob(b=>save(b,fname()+'_season_tree_answers.png'));toast('Picture saved — send it to your teacher!')}
async function dlCard(){if(!S.card){toast('Make your card first (Autumn, task 8).');return}
  try{await document.fonts.ready}catch(e){}
  const c=document.createElement('canvas');c.width=1000;c.height=620;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,1000,620);g.addColorStop(0,'#3A2457');g.addColorStop(.6,'#55377A');g.addColorStop(1,'#2F6B4A');x.fillStyle=g;x.fillRect(0,0,1000,620);
  x.fillStyle='rgba(125,179,138,.25)';[[860,520,140],[760,560,90],[940,420,80]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill()});
  x.fillStyle='#CFE9D6';x.font='800 58px Baloo, sans-serif';x.fillText('My season card',60,110);
  x.fillStyle='#fff';x.font='600 36px Baloo, sans-serif';const lines=S.card.text.split(/(?<=\.)\s/);let y=190;
  for(const ln of lines){const words=ln.split(' ');let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width>820){x.fillText(cur,60,y);y+=50;cur=w}else cur=t}x.fillText(cur,60,y);y+=54}
  x.fillStyle='#FFE2A8';x.font='700 26px Baloo, sans-serif';x.fillText('The Season Tree · '+S.leaves+' leaves',60,580);
  c.toBlob(b=>save(b,fname()+'_season_card.png'));toast('Card downloaded')}

/* ============ teacher ============ */

  const un=h('button',{class:'btn small '+(S.teacher?'green':'ghost'),style:'font-size:16px;padding:6px 14px',onclick:()=>{S.teacher=!S.teacher;renderTabs();renderTeacher();go(S.level)}},S.teacher?'Все уровни открыты':'Открыть все уровни');
  d.append(h('h2',{},'Для учителя'),h('p',{style:'color:var(--grey)'},'Домашка для Алисы: months, seasons, have got / has got, to be. Уровни открываются по очереди; кнопка ниже открывает всё сразу, чтобы посмотреть. Листики за повторный просмотр не добавляются.'),un,
    h('details',{open:true},h('summary',{},'Результаты сейчас'),h('pre',{style:'white-space:pre-wrap;font-family:inherit;font-size:14px;background:var(--mist);padding:10px;border-radius:10px'},report()),
      h('button',{class:'btn ghost',style:'font-size:15px;padding:5px 12px',onclick:dlResults},'Скачать .txt'),' ',h('button',{class:'btn ghost',style:'font-size:15px;padding:5px 12px',onclick:dlImage},'Скачать картинкой')),
    h('details',{html:'<summary>Ключи</summary><p><b>1–2.</b> Порядок месяцев; winter: Dec, Jan, Feb · spring: Mar–May · summer: Jun–Aug · autumn: Sep–Nov.</p><p><b>3.</b> Вопросы случайные (номер месяца, что дальше/раньше, между, правописание).</p><p><b>4.</b> Везде правильный — с заглавной буквой и in; When’s your birthday?</p><p><b>5.</b> has got · hasn’t got · have got · hasn’t got · haven’t got · has got · has got · hasn’t got.</p><p><b>6.</b> Yes, he has · No, they haven’t · Yes, she has · Yes, she has · No, he hasn’t · Yes, they have.</p><p><b>7.</b> is · are · am · is · isn’t · aren’t.</p><p><b>8.</b> Карточка о себе — попросите прочитать её вслух на уроке.</p>'}),
    h('details',{html:'<summary>Как сдавать</summary><p>В конце (вкладка «My tree») есть кнопки: скачать результаты (.txt с ошибками и первыми попытками), скачать карточку (.png) и скопировать результаты в сообщение.</p>'}))}
